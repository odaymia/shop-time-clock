<style>
  html, body { margin:0; padding:0; background:#12161c; -webkit-text-size-adjust:100%; }
  body { overscroll-behavior:none; }
  #root { min-height:100vh; min-height:100dvh; }
  #boot {
    position:fixed; inset:0; display:flex; align-items:center; justify-content:center;
    flex-direction:column; gap:14px; background:#12161c; color:#8b98a8; z-index:999;
    font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,Helvetica,Arial,sans-serif;
  }
  #boot .ring {
    width:34px; height:34px; border-radius:50%;

  }

<div id="boot"><div class="ring"></div><div id="bootmsg">Starting the time clock…</div></div>

<script>
/* ------------------------------------------------------------------
   Storage. Inside Claude, artifacts get a window.storage API. Out here
   we provide the same shape backed by IndexedDB, which unlike
   localStorage has room for months of punch photos.
------------------------------------------------------------------ */
(function () {
  var DB = "shopTimeClock", STORE = "kv", dbp = null;

  function open() {
    if (dbp) return dbp;
    dbp = new Promise(function (res, rej) {
      var r = indexedDB.open(DB, 1);
      r.onupgradeneeded = function () {
        var db = r.result;
        if (!db.objectStoreNames.contains(STORE)) db.createObjectStore(STORE);
      };
      r.onsuccess = function () { res(r.result); };
      r.onerror = function () { rej(r.error); };
    });
    return dbp;
  }

  function tx(mode, fn) {
    return open().then(function (db) {
      return new Promise(function (res, rej) {
        var t = db.transaction(STORE, mode);
        var store = t.objectStore(STORE);
        var out = fn(store);
        t.oncomplete = function () { res(out && out.result !== undefined ? out.result : out); };
        t.onerror = function () { rej(t.error); };
        t.onabort = function () { rej(t.error); };
      });
    });
  }

  window.storage = {
    get: function (key) {
      return tx("readonly", function (s) { return s.get(key); }).then(function (v) {
        return v === undefined ? null : { key: key, value: v, shared: false };
      });
    },
    set: function (key, value) {
      return tx("readwrite", function (s) { s.put(value, key); }).then(function () {
        return { key: key, value: value, shared: false };
      });
    },
    delete: function (key) {
      return tx("readwrite", function (s) { s.delete(key); }).then(function () {
        return { key: key, deleted: true, shared: false };
      });
    },
    list: function (prefix) {
      return tx("readonly", function (s) { return s.getAllKeys(); }).then(function (keys) {
        var all = keys || [];
        var filtered = prefix ? all.filter(function (k) { return String(k).indexOf(prefix) === 0; }) : all;
        return { keys: filtered, prefix: prefix, shared: false };
      });
    }
  };

  /* Ask Safari not to evict this data. Without it, iOS can clear site
     storage after a stretch of disuse. Adding to the Home Screen plus
     this call is what keeps punches around. */
  if (navigator.storage && navigator.storage.persist) {
    navigator.storage.persist().catch(function () {});
  }

  /* Keep the shop iPad awake while the clock is on screen. */
  var lock = null;
  function keepAwake() {
    if (!navigator.wakeLock) return;
    navigator.wakeLock.request("screen").then(function (l) { lock = l; }).catch(function () {});
  }
  keepAwake();
  document.addEventListener("visibilitychange", function () {
    if (document.visibilityState === "visible") keepAwake();
  });
})();
</script>

  var b = document.getElementById("bootmsg");
  if (b) {
    b.className = "err";
    b.textContent = "Couldn't start: " + (e.message || "unknown error") +
      ". If this is the first load, check the iPad has internet — the app pulls React from the web the first time.";
    var r = document.querySelector("#boot .ring");
    if (r) r.style.display = "none";

<script type="text/babel" data-presets="react">
const { useState, useEffect, useRef, useCallback } = React;


/* ---------------------------------------------------------------------------
   Shop Time Clock — iPad kiosk
   Storage keys:
     gac:config              -> shop settings
     gac:employees           -> roster
     gac:punches:YYYY-MM     -> punch events for that month
--------------------------------------------------------------------------- */

const CFG_KEY = "gac:config";
const EMP_KEY = "gac:employees";
const punchKey = (ym) => `gac:punches:${ym}`;
const photoKeyFor = (ts, id) => `gac:photo:${ts}:${id}`;
const signKeyFor = (periodStart, empId) => `gac:signature:${periodStart}:${empId}`;
const attestKeyFor = (periodStart, empId) => `gac:attest:${periodStart}:${empId}`;
const schedKeyFor = (weekStart) => `gac:schedule:${weekStart}`;

const DEFAULT_CFG = {
  shopName: "Genie Auto Center",
  managerPin: "",
  weekStart: 1, // 0=Sun ... 6=Sat
  roundingMin: 0, // 0, 5, 6, 15
  openHour: 8,
  closeHour: 18,
  otRules: "ca", // "ca" = daily >8 / >12, weekly >40 ; "flsa" = weekly >40 only
  photos: true, // take a photo with each punch
  photoRequired: false, // block the punch if the camera isn't working
  photoRetentionDays: 45, // photos older than this are deleted automatically
  attestation: true, // sign off on hours at the end of the pay period
  breakRules: true, // California meal and rest period tracking
  breakReminderMin: 20, // warn this many minutes before the meal deadline
  mealPay: "discretionary", // "unpaid" | "discretionary" (manager marks it) | "always"
  minStaff: 2, // never leave fewer than this many people on the floor
  graceMin: 6, // minutes of slack before a late start or early out gets flagged
};

/* A lunch is paid when the shop always pays, or when a manager marked
   that particular one. Either way it stays a real off-duty 30 minutes. */
const mealIsPaid = (meal, cfg) =>
  cfg.mealPay === "always" || (cfg.mealPay === "discretionary" && !!meal.paid);

/* ---------- storage ---------- */
async function sGet(key, fallback) {
  try {
    const r = await window.storage.get(key);
    if (!r || r.value == null) return fallback;
    return JSON.parse(r.value);
  } catch {
    return fallback;
  }
}
async function sSet(key, value) {
  try {
    await window.storage.set(key, JSON.stringify(value));
    return true;
  } catch (e) {
    console.error("storage write failed", key, e);
    return false;
  }
}

async function sDel(key) {
  try {
    await window.storage.delete(key);
  } catch {
    /* already gone */
  }
}
async function sList(prefix) {
  try {
    const r = await window.storage.list(prefix);
    return (r && r.keys) || [];
  } catch {
    return [];
  }
}

/* Photos live in their own keys so punch records stay small.
   The key carries the timestamp, which is what lets us expire them. */
async function purgePhotos(retentionDays) {
  if (!retentionDays) return 0;
  const cutoff = Date.now() - retentionDays * 86400000;
  const keys = await sList("gac:photo:");
  let n = 0;
  for (const k of keys) {
    const ts = Number(String(k).split(":")[2]);
    if (Number.isFinite(ts) && ts < cutoff) {
      await sDel(k);
      n++;
    }
  }
  return n;
}

/* ---------- time helpers ---------- */
const uid = () => Math.random().toString(36).slice(2, 10) + Date.now().toString(36);
const pad2 = (n) => String(n).padStart(2, "0");
const ym = (d) => `${d.getFullYear()}-${pad2(d.getMonth() + 1)}`;
const dayKey = (d) => `${d.getFullYear()}-${pad2(d.getMonth() + 1)}-${pad2(d.getDate())}`;

function fmtTime(d) {
  if (!d) return "—";
  let h = d.getHours();
  const m = pad2(d.getMinutes());
  const ap = h >= 12 ? "PM" : "AM";
  h = h % 12 || 12;
  return `${h}:${m} ${ap}`;
}
function fmtTimeInput(d) {
  return `${pad2(d.getHours())}:${pad2(d.getMinutes())}`;
}
function fmtDateLong(d) {
  return d.toLocaleDateString(undefined, { weekday: "long", month: "long", day: "numeric" });
}
function fmtDateShort(d) {
  return d.toLocaleDateString(undefined, { weekday: "short", month: "numeric", day: "numeric" });
}
function hoursText(ms) {
  if (!ms || ms < 0) ms = 0;
  const total = Math.round(ms / 60000);
  const h = Math.floor(total / 60);
  const m = total % 60;
  return `${h}h ${pad2(m)}m`;
}
function decHours(ms) {
  if (!ms || ms < 0) return 0;
  return Math.round((ms / 3600000) * 100) / 100;
}
function startOfWeek(d, weekStart) {
  const x = new Date(d.getFullYear(), d.getMonth(), d.getDate());
  const diff = (x.getDay() - weekStart + 7) % 7;
  x.setDate(x.getDate() - diff);
  return x;
}
function addDays(d, n) {
  const x = new Date(d);
  x.setDate(x.getDate() + n);
  return x;
}
function roundTs(ts, mins) {
  if (!mins) return ts;
  const step = mins * 60000;
  return Math.round(ts / step) * step;
}

/* ---------- shift building ---------- */
/* California treats the two break types completely differently:
   a rest period is 10 minutes, paid, on the clock; a meal period is
   30 minutes, unpaid, off duty. They can never share one bucket. */
const MEAL_START = ["mealStart", "breakStart"]; // breakStart = pre-split records
const MEAL_END = ["mealEnd", "breakEnd"];

function buildSessions(events, cfg) {
  const sorted = [...events].sort((a, b) => a.ts - b.ts);
  const out = [];
  let cur = null;
  const closeMeal = (s, ts) => {
    if (s && s.openMeal != null) {
      s.meals.push({ start: s.openMeal, end: ts, paid: !!s.openMealPaid, id: s.openMealId });
      s.openMeal = null;
      s.openMealPaid = false;
      s.openMealId = null;
    }
  };
  const closeRest = (s, ts) => {
    if (s && s.openRest != null) {
      s.rests.push({ start: s.openRest, end: ts });
      s.openRest = null;
    }
  };
  for (const e of sorted) {
    const ts = roundTs(e.ts, cfg.roundingMin);
    if (e.type === "in") {
      if (cur) {
        closeMeal(cur, ts);
        closeRest(cur, ts);
        cur.end = null;
        cur.missingOut = true;
        out.push(cur);
      }
      cur = {
        id: e.id,
        start: ts,
        end: null,
        meals: [],
        rests: [],
        openMeal: null,
        openRest: null,
        openMealPaid: false,
        openMealId: null,
        missingOut: false,
      };
    } else if (MEAL_START.includes(e.type)) {
      if (cur && cur.openMeal == null) {
        closeRest(cur, ts);
        cur.openMeal = ts;
        cur.openMealPaid = !!e.paidMeal;
        cur.openMealId = e.id;
      }
    } else if (MEAL_END.includes(e.type)) {
      closeMeal(cur, ts);
    } else if (e.type === "restStart") {
      if (cur && cur.openRest == null && cur.openMeal == null) cur.openRest = ts;
    } else if (e.type === "restEnd") {
      closeRest(cur, ts);
    } else if (e.type === "out") {
      if (cur) {
        closeMeal(cur, ts);
        closeRest(cur, ts);
        cur.end = ts;
        out.push(cur);
        cur = null;
      }
    }
  }
  if (cur) {
    cur.open = true;
    out.push(cur);
  }
  return out;
}

/* Paid time = everything on the clock, minus the lunches the shop isn't
   paying for. Rest periods are always paid, so they're never subtracted. */
function sessionWorkedMs(s, cfg, nowMs) {
  const end = s.end != null ? s.end : s.missingOut ? s.start : nowMs;
  let ms = end - s.start;
  for (const m of s.meals) if (!mealIsPaid(m, cfg)) ms -= m.end - m.start;
  if (s.openMeal != null && !mealIsPaid({ paid: s.openMealPaid }, cfg)) {
    ms -= (s.end != null ? s.end : nowMs) - s.openMeal;
  }
  return Math.max(0, ms);
}
/* Lunch minutes the shop gave away, for cost visibility. */
function sessionPaidMealMs(s, cfg) {
  return s.meals.reduce((a, m) => a + (mealIsPaid(m, cfg) ? m.end - m.start : 0), 0);
}
function sessionMealMs(s, nowMs) {
  let ms = 0;
  for (const m of s.meals) ms += m.end - m.start;
  if (s.openMeal != null) ms += nowMs - s.openMeal;
  return ms;
}
function sessionRestMs(s, nowMs) {
  let ms = 0;
  for (const r of s.rests) ms += r.end - r.start;
  if (s.openRest != null) ms += nowMs - s.openRest;
  return ms;
}
/* kept so older call sites keep working */
function sessionBreakMs(s, nowMs) {
  return sessionMealMs(s, nowMs) + sessionRestMs(s, nowMs);
}

/* ---------- California break rules ---------- */
const MEAL_MIN_MS = 30 * 60000;
const REST_MIN_MS = 10 * 60000;
const HOUR = 3600000;

/* Rest periods: one per four hours "or major fraction thereof."
   The DLSE reads that as the bands below, not as a rounding formula. */
function restsEntitled(hours) {
  if (hours < 3.5) return 0;
  if (hours <= 6) return 1;
  if (hours <= 10) return 2;
  if (hours <= 14) return 3;
  return 4;
}

/* Evaluates one worked day against Labor Code 512 and the wage order.
   Returns what was owed, what happened, and what premium that triggers. */
function breakCompliance(sessions, cfg, nowMs, attestation, emp) {
  const workedMs = sessions.reduce((a, s) => a + sessionWorkedMs(s, cfg, nowMs), 0);
  const hours = workedMs / HOUR;
  const meals = sessions.flatMap((s) => s.meals).sort((a, b) => a.start - b.start);
  const rests = sessions.flatMap((s) => s.rests);
  const shiftStart = sessions.length ? Math.min(...sessions.map((s) => s.start)) : null;
  const closed = sessions.length > 0 && sessions.every((s) => s.end != null);

  const res = {
    hours,
    shiftStart,
    meals,
    paidMealMs: sessions.reduce((a, s) => a + sessionPaidMealMs(s, cfg), 0),
    restsTaken: rests.filter((r) => r.end - r.start >= REST_MIN_MS - 30000).length,
    restsLogged: rests.length,
    issues: [],
    mealPremium: 0,
    restPremium: 0,
    meal1: null,
    meal2: null,
    restsOwed: restsEntitled(hours),
  };
  if (!sessions.length || shiftStart == null) return res;

  const waived1 = attestation?.meal1 === "waived";
  const waived2 = attestation?.meal2 === "waived";
  const denied = (k) => attestation?.[k] === "denied";

  /* ---- first meal: must begin before the end of the 5th hour ---- */
  if (hours > 5) {
    const deadline = shiftStart + 5 * HOUR;
    const m = meals[0] || null;
    const dur = m ? m.end - m.start : 0;
    const canWaive = hours <= 6;
    const info = {
      required: true,
      deadline,
      taken: !!m,
      start: m ? m.start : null,
      minutes: m ? Math.round(dur / 60000) : 0,
      late: m ? m.start > deadline : false,
      short: m ? dur < MEAL_MIN_MS - 30000 : false,
      canWaive,
      waived: waived1 && canWaive,
    };
    info.ok = info.waived || (info.taken && !info.late && !info.short);
    res.meal1 = info;

    if (!info.ok && closed) {
      if (!info.taken) res.issues.push(canWaive ? "No lunch taken" : "Lunch missed");
      else if (info.short) res.issues.push(`Lunch was only ${info.minutes} min`);
      else if (info.late) res.issues.push(`Lunch started after the 5th hour`);
      if (!waived1) res.mealPremium = 1;
    }
  }

  /* ---- second meal: before the end of the 10th hour ---- */
  if (hours > 10) {
    /* A paid lunch is time worked, so it doesn't push the deadline out.
       An unpaid one does, because those minutes aren't hours worked. */
    const first = meals[0];
    const firstDur = first ? first.end - first.start : 0;
    const deadline =
      shiftStart + 10 * HOUR + (first && mealIsPaid(first, cfg) ? 0 : firstDur);
    const m = meals[1] || null;
    const dur = m ? m.end - m.start : 0;
    const canWaive = hours <= 12 && !waived1;
    const info = {
      required: true,
      deadline,
      taken: !!m,
      start: m ? m.start : null,
      minutes: m ? Math.round(dur / 60000) : 0,
      late: m ? m.start > deadline : false,
      short: m ? dur < MEAL_MIN_MS - 30000 : false,
      canWaive,
      waived: waived2 && canWaive,
    };
    info.ok = info.waived || (info.taken && !info.late && !info.short);
    res.meal2 = info;
    if (!info.ok && closed && !waived2) {
      res.issues.push("Second lunch missed on a shift over 10 hours");
      res.mealPremium = 1; // statute caps meal premiums at one per day
    }
  }

  /* ---- rest periods ---- */
  if (res.restsOwed > res.restsTaken && closed) {
    res.issues.push(
      `${res.restsOwed - res.restsTaken} rest break${
        res.restsOwed - res.restsTaken > 1 ? "s" : ""
      } not logged`
    );
    if (attestation?.rest !== "taken") res.restPremium = 1;
  }

  /* An employee saying they were prevented is the thing that decides
     whether a premium is owed — a waiver only counts if it was free. */
  if (denied("meal1") || denied("meal2")) res.mealPremium = 1;
  if (denied("rest")) res.restPremium = 1;

  return res;
}

/* What the person on the clock owes next, for live prompts. */
function nextBreakDue(session, cfg, nowMs) {
  if (!session || session.end != null) return null;
  const workedMs = sessionWorkedMs(session, cfg, nowMs);
  const meals = session.meals;
  if (session.openMeal != null) {
    const elapsed = nowMs - session.openMeal;
    return {
      kind: "onMeal",
      dueAt: session.openMeal + MEAL_MIN_MS,
      remaining: MEAL_MIN_MS - elapsed,
      label: "On lunch",
    };
  }
  if (session.openRest != null) {
    const elapsed = nowMs - session.openRest;
    return {
      kind: "onRest",
      dueAt: session.openRest + REST_MIN_MS,
      remaining: REST_MIN_MS - elapsed,
      label: "On rest break",
    };
  }
  const goodMeals = meals.filter((m) => m.end - m.start >= MEAL_MIN_MS - 30000);
  if (goodMeals.length === 0) {
    const deadline = session.start + 5 * HOUR;
    if (workedMs > 3.5 * HOUR || nowMs > deadline - 90 * 60000) {
      return {
        kind: "meal1",
        dueAt: deadline,
        remaining: deadline - nowMs,
        label: "Lunch due",
      };
    }
  } else if (workedMs > 10 * HOUR && goodMeals.length < 2) {
    const firstDur = meals[0].end - meals[0].start;
    const deadline = session.start + 10 * HOUR + firstDur;
    return {
      kind: "meal2",
      dueAt: deadline,
      remaining: deadline - nowMs,
      label: "Second lunch due",
    };
  }
  return null;
}

/* ---------- overtime ---------- */
function splitDay(hrs, rules) {
  if (rules !== "ca") return { reg: hrs, ot: 0, dt: 0 };
  const reg = Math.min(hrs, 8);
  const ot = Math.max(0, Math.min(hrs, 12) - 8);
  const dt = Math.max(0, hrs - 12);
  return { reg, ot, dt };
}
function weekTotals(dayHourList, rules) {
  let reg = 0,
    ot = 0,
    dt = 0;
  for (const h of dayHourList) {
    const s = splitDay(h, rules);
    reg += s.reg;
    ot += s.ot;
    dt += s.dt;
  }
  if (reg > 40) {
    ot += reg - 40;
    reg = 40;
  }
  const r = (n) => Math.round(n * 100) / 100;
  return { reg: r(reg), ot: r(ot), dt: r(dt), total: r(reg + ot + dt) };
}

/* ---------- schedule helpers ---------- */
const hhmmToMin = (s) => {
  const [h, m] = String(s || "").split(":").map(Number);
  return Number.isFinite(h) && Number.isFinite(m) ? h * 60 + m : null;
};
function fmtHHMM(s) {
  const mins = hhmmToMin(s);
  if (mins == null) return "—";
  let h = Math.floor(mins / 60) % 24;
  const m = mins % 60;
  const ap = h >= 12 ? "p" : "a";
  h = h % 12 || 12;
  return m === 0 ? `${h}${ap}` : `${h}:${pad2(m)}${ap}`;
}
/* Minutes a scheduled shift actually pays for. An overnight shift wraps. */
function shiftMinutes(shift, cfg) {
  if (!shift || !shift.start || !shift.end) return 0;
  const a = hhmmToMin(shift.start);
  let b = hhmmToMin(shift.end);
  if (a == null || b == null) return 0;
  if (b <= a) b += 24 * 60;
  const lunch = cfg?.mealPay === "always" ? 0 : Number(shift.lunch) || 0;
  return Math.max(0, b - a - lunch);
}
const shiftHours = (shift, cfg) => Math.round((shiftMinutes(shift, cfg) / 60) * 100) / 100;

const SHIFT_PRESETS = [
  { label: "Open", start: "08:00", end: "16:00", lunch: 30 },
  { label: "Mid", start: "09:00", end: "17:00", lunch: 30 },
  { label: "Close", start: "10:00", end: "18:00", lunch: 30 },
  { label: "Half day", start: "08:00", end: "12:00", lunch: 0 },
];

/* Anchor a scheduled "HH:MM" to a real calendar day so it can be compared
   against punch timestamps. Wraps past midnight for overnight shifts. */
function schedTs(date, hhmm, wrapPastStart) {
  const mins = hhmmToMin(hhmm);
  if (mins == null) return null;
  const base = new Date(date.getFullYear(), date.getMonth(), date.getDate(), 0, 0, 0, 0);
  let ts = base.getTime() + mins * 60000;
  if (wrapPastStart != null && ts <= wrapPastStart) ts += 24 * 3600000;
  return ts;
}

/* ---------- pay period ---------- */
function periodEnd(cfg, periodStartDate) {
  return addDays(periodStartDate, 6);
}
function isLastDayOfPeriod(cfg, d) {
  return dayKey(d) === dayKey(periodEnd(cfg, startOfWeek(d, cfg.weekStart)));
}

/* One place that turns raw punches into the numbers a person signs for.
   The review screen and the manager timecard both call this, so what the
   employee agrees to is exactly what shows up on the payroll export. */
function periodSummary(events, cfg, periodStartDate, nowMs) {
  const wStart = periodStartDate.getTime();
  const wEnd = addDays(periodStartDate, 7).getTime();
  const sessions = buildSessions(
    [...events].sort((a, b) => a.ts - b.ts),
    cfg
  ).filter((s) => s.start >= wStart && s.start < wEnd);

  const days = Array.from({ length: 7 }, (_, i) => addDays(periodStartDate, i));
  const rows = days.map((d) => {
    const k = dayKey(d);
    const mine = sessions.filter((s) => dayKey(new Date(s.start)) === k);
    const ms = mine.reduce((a, s) => a + sessionWorkedMs(s, cfg, nowMs), 0);
    const breakMs = mine.reduce((a, s) => a + sessionBreakMs(s, nowMs), 0);
    const mealMs = mine.reduce((a, s) => a + sessionMealMs(s, nowMs), 0);
    const paidMealMs = mine.reduce((a, s) => a + sessionPaidMealMs(s, cfg), 0);
    const restCount = mine.reduce((a, s) => a + s.rests.length, 0);
    return {
      date: d,
      ms,
      breakMs,
      mealMs,
      paidMealMs,
      restCount,
      sessions: mine,
      hours: decHours(ms),
    };
  });
  const totals = weekTotals(rows.map((r) => r.hours), cfg.otRules);
  const openShift = sessions.some((s) => s.open || s.missingOut);
  return { days, rows, totals, sessions, openShift };
}

/* ---------- camera ---------- */
const CAM_MSG = {
  idle: "",
  starting: "Camera starting…",
  live: "Camera on — a photo is saved with your punch",
  denied: "Camera blocked. Allow camera access in Safari settings.",
  unsupported: "No camera available on this device.",
};

function useCamera(enabled) {
  const [stream, setStream] = useState(null);
  const [state, setState] = useState("idle");
  const videoRef = useRef(null);
  const streamRef = useRef(null);

  const start = useCallback(async () => {
    if (!enabled) return;
    if (streamRef.current) {
      setState("live");
      return;
    }
    if (!navigator.mediaDevices || !navigator.mediaDevices.getUserMedia) {
      setState("unsupported");
      return;
    }
    setState("starting");
    try {
      const s = await navigator.mediaDevices.getUserMedia({
        video: { facingMode: "user", width: { ideal: 640 }, height: { ideal: 480 } },
        audio: false,
      });
      streamRef.current = s;
      setStream(s);
      setState("live");
    } catch (err) {
      setState(err && err.name === "NotAllowedError" ? "denied" : "unsupported");
    }
  }, [enabled]);

  const stop = useCallback(() => {
    if (streamRef.current) {
      streamRef.current.getTracks().forEach((t) => t.stop());
      streamRef.current = null;
      setStream(null);
    }
    setState("idle");
  }, []);

  /* Downscale hard: a 320px JPEG is plenty to recognise a face
     and keeps a year of punches inside the storage budget. */
  const capture = useCallback(() => {
    const v = videoRef.current;
    if (!v || !v.videoWidth) return null;
    try {
      const w = 320;
      const h = Math.round((v.videoHeight / v.videoWidth) * w);
      const c = document.createElement("canvas");
      c.width = w;
      c.height = h;
      const ctx = c.getContext("2d");
      ctx.translate(w, 0);
      ctx.scale(-1, 1); // un-mirror so the saved photo reads naturally
      ctx.drawImage(v, 0, 0, w, h);
      return c.toDataURL("image/jpeg", 0.55);
    } catch {
      return null;
    }
  }, []);

  useEffect(() => () => stop(), [stop]);

  return { stream, state, start, stop, capture, videoRef };
}

function CameraFeed({ cam, size = "sm" }) {
  const { stream, state, videoRef } = cam;
  useEffect(() => {
    if (videoRef.current && stream) {
      videoRef.current.srcObject = stream;
      const p = videoRef.current.play();
      if (p && p.catch) p.catch(() => {});
    }
  }, [stream, videoRef]);

  return (
    <div className={`cam ${size} ${state}`}>
      <video ref={videoRef} playsInline muted autoPlay className="camVid" />
      {state !== "live" && (
        <div className="camFallback">
          <span className="camIcon">◉</span>
          <span>{CAM_MSG[state] || "Camera off"}</span>
        </div>
      )}
      {state === "live" && <span className="camDot" />}
    </div>
  );
}

/* ---------- signature ---------- */
function SignaturePad({ onChange }) {
  const canvasRef = useRef(null);
  const drawing = useRef(false);
  const hasInk = useRef(false);
  const last = useRef(null);

  useEffect(() => {
    const c = canvasRef.current;
    if (!c) return;
    const dpr = Math.min(window.devicePixelRatio || 1, 2);
    const rect = c.getBoundingClientRect();
    c.width = rect.width * dpr;
    c.height = rect.height * dpr;
    const ctx = c.getContext("2d");
    ctx.scale(dpr, dpr);
    ctx.lineWidth = 2.4;
    ctx.lineCap = "round";
    ctx.lineJoin = "round";
    ctx.strokeStyle = "#e9eef4";
  }, []);

  const pos = (e) => {
    const r = canvasRef.current.getBoundingClientRect();
    const p = e.touches ? e.touches[0] : e;
    return { x: p.clientX - r.left, y: p.clientY - r.top };
  };
  const down = (e) => {
    e.preventDefault();
    drawing.current = true;
    last.current = pos(e);
  };
  const move = (e) => {
    if (!drawing.current) return;
    e.preventDefault();
    const ctx = canvasRef.current.getContext("2d");
    const p = pos(e);
    ctx.beginPath();
    ctx.moveTo(last.current.x, last.current.y);
    ctx.lineTo(p.x, p.y);
    ctx.stroke();
    last.current = p;
    if (!hasInk.current) {
      hasInk.current = true;
      onChange(true);
    }
  };
  const up = () => {
    drawing.current = false;
  };

  const clear = () => {
    const c = canvasRef.current;
    const ctx = c.getContext("2d");
    ctx.clearRect(0, 0, c.width, c.height);
    hasInk.current = false;
    onChange(false);
  };

  /* Flatten to a small PNG — line art compresses to a few KB. */
  const exportPng = () => {
    const c = canvasRef.current;
    if (!c || !hasInk.current) return null;
    const out = document.createElement("canvas");
    out.width = 480;
    out.height = Math.round((c.height / c.width) * 480);
    const ctx = out.getContext("2d");
    ctx.fillStyle = "#1a2029";
    ctx.fillRect(0, 0, out.width, out.height);
    ctx.drawImage(c, 0, 0, out.width, out.height);
    return out.toDataURL("image/png");
  };

  useEffect(() => {
    if (canvasRef.current) canvasRef.current.__export = exportPng;
  });

  return (
    <div className="sigWrap">
      <canvas
        ref={canvasRef}
        className="sigPad"
        onPointerDown={down}
        onPointerMove={move}
        onPointerUp={up}
        onPointerLeave={up}
        onTouchStart={down}
        onTouchMove={move}
        onTouchEnd={up}
      />
      <div className="sigBase">
        <span className="sigX">✕ ————————————————</span>
        <button className="btn tiny" onClick={clear}>
          Clear
        </button>
      </div>
      <input type="hidden" ref={(el) => el && (el.__pad = canvasRef.current)} />
    </div>
  );
}

   shifts into view — the roster is filtered down to this employee before

    })();
    return () => {
      dead = true;
    };

            className="btn ghost"

            {offset === 0 ? "This week" : offset === 1 ? "Next week" : `${offset} weeks out`}
          </span>
          <button
            className="btn ghost"
            onClick={() => setOffset((o) => o + 1)}
            disabled={offset >= 3}
          >

          </button>
        </div>

        {sched === undefined ? (
          <p className="muted pad">Loading…</p>
        ) : !mine ? (
          <div className="schedEmpty">

          </div>

              const k = dayKey(d);

              return (
                <li key={k} className={`${isToday ? "today" : ""} ${sh ? "" : "off"}`}>
                  <span className="myDayName">
                    {d.toLocaleDateString(undefined, { weekday: "long" })}
                    <em>{d.toLocaleDateString(undefined, { month: "short", day: "numeric" })}</em>
                  </span>
                  {sh ? (
                    <>
                      <span className="myTimes">
                        {fmtHHMM(sh.start)} – {fmtHHMM(sh.end)}
                      </span>
                      <span className="myMeta">
                        {shiftHours(sh, cfg).toFixed(1)} hrs
                        {sh.lunch ? ` · ${sh.lunch}m lunch` : ""}
                      </span>
                      {sh.note && <span className="myNote">{sh.note}</span>}
                    </>
                  ) : (
                    <span className="myTimes offTxt">Off</span>
                  )}
                  {isToday && <span className="todayTag">Today</span>}
                </li>
              );
            })}
          </ul>
        )}

        <button className="linkBtn wide" onClick={onClose}>
          Done
        </button>
      </div>
    </div>
  );
}

/* ---------- daily break attestation ---------- */
/* Brinker v. Superior Court says the employer must provide breaks, not
   police them. So this asks what happened rather than blocking anyone:
   a free choice to skip is a waiver, being prevented is a premium hour. */
function BreakAttest({ emp, comp, onSubmit, onSkip }) {
  const [meal, setMeal] = useState(null);
  const [rest, setRest] = useState(null);
  const [note, setNote] = useState("");

  const needMeal = comp.meal1 && !comp.meal1.ok;
  const needRest = comp.restsOwed > comp.restsTaken;
  const canWaive = comp.meal1?.canWaive;
  const ready = (!needMeal || meal) && (!needRest || rest);

  const mealQ = !comp.meal1?.taken
    ? "You didn't take a lunch today."
    : comp.meal1.short
    ? `Your lunch was ${comp.meal1.minutes} minutes instead of 30.`
    : "Your lunch started after the end of your fifth hour.";

  return (
    <div className="overlay">
      <div className="reviewCard">
        <h2 className="reviewTitle">Before you go, {emp.name.split(" ")[0]}</h2>

          <div className="attestBlock">
            <p className="attestQ">{mealQ}</p>

                <span>

              </button>
              <button
                className={`attestOpt ${meal === "denied" ? "on" : ""}`}
                onClick={() => setMeal("denied")}

                <strong>I couldn't take it</strong>
                <span>Too busy, told not to, or no coverage. The shop owes me for this.</span>
              </button>
            </div>
          </div>
        )}

        {needRest && (

            <p className="attestQ">
              You logged {comp.restsTaken} of {comp.restsOwed} paid rest breaks.
            </p>

              <button
                className={`attestOpt ${rest === "taken" ? "on" : ""}`}
                onClick={() => setRest("taken")}
              >
                <strong>I took them, just didn't clock them</strong>

              </button>

              >

                <span>They were available and I skipped them.</span>

            <span>Anything you want your manager to know? (optional)</span>

              className="disputeBox short"
              value={note}
              onChange={(e) => setNote(e.target.value)}
              placeholder="Example: three cars stacked up and nobody could cover my bay."
            />

        )}

        <div className="reviewActs">
          <button
            className="bigAct in"
            disabled={!ready}
            onClick={() => onSubmit({ meal1: meal, rest, note: note.trim() })}

            Submit and clock out
          </button>
        </div>
        <p className="signFine">
          If you say you were prevented from taking a break, California requires an extra hour of pay
          at your regular rate. That gets flagged for payroll automatically.
        </p>
        <button className="linkBtn wide" onClick={onSkip}>
          Skip for now
        </button>
      </div>
    </div>
  );
}

      setMonths(m);
      setScreen(c && c.managerPin ? "kiosk" : "setup");
      setReady(true);
      purgePhotos(merged.photoRetentionDays);
    })();
  }, []);

  /* tick */
  useEffect(() => {
    const t = setInterval(() => setNow(Date.now()), 1000);
    return () => clearInterval(t);
  }, []);

  const cam = useCamera(cfg.photos);

  const flash = useCallback((text, tone) => {
    setToast({ text, tone });
    clearTimeout(toastTimer.current);
    toastTimer.current = setTimeout(() => setToast(null), 3000);

    async (key) => {

      const data = await sGet(punchKey(key), []);
      monthsRef.current = { ...monthsRef.current, [key]: data };
      setMonths(monthsRef.current);
      return data;
    },
    [months]
  );

  const allEvents = useCallback(() => {
    return Object.values(months).flat();
  }, [months]);

  const eventsFor = useCallback(
    (empId) => allEvents().filter((e) => e.empId === empId),
    [allEvents]
  );

  const addEvent = useCallback(
    async (empId, type, ts, photo, payload) => {
      const at = ts || Date.now();
      const key = ym(new Date(at));
      const existing = months[key] || (await sGet(punchKey(key), []));
      const ev = { id: uid(), empId, type, ts: at };
      if (payload) ev.payload = payload;
      if (photo) {
        const pk = photoKeyFor(at, ev.id);
        const ok = await sSet(pk, photo);
        if (ok) ev.photoKey = pk;
      }
      const next = [...existing, ev];
      monthsRef.current = { ...monthsRef.current, [key]: next };
      setMonths(monthsRef.current);
      await sSet(punchKey(key), next);
      return ev;
    },
    [months]
  );

  const updateEvents = useCallback(async (key, list) => {
    monthsRef.current = { ...monthsRef.current, [key]: list };
    setMonths(monthsRef.current);
    await sSet(punchKey(key), list);
  }, []);

  const saveCfg = useCallback(async (next) => {
    setCfg(next);
    await sSet(CFG_KEY, next);
  }, []);
  const saveEmployees = useCallback(async (next) => {
    setEmployees(next);
    await sSet(EMP_KEY, next);
  }, []);

  /* status */
  const sessionsToday = useCallback(
    (empId) => {
      const start = new Date();
      start.setHours(0, 0, 0, 0);
      const evs = eventsFor(empId).filter((e) => e.ts >= start.getTime());
      return buildSessions(evs, cfg);
    },
    [eventsFor, cfg]
  );

  const statusOf = useCallback(
    (empId) => {
      const evs = eventsFor(empId).sort((a, b) => a.ts - b.ts);
      const last = evs[evs.length - 1];
      if (!last || last.type === "out") return { state: "out", since: null };
      if (MEAL_START.includes(last.type)) return { state: "meal", since: last.ts };
      if (last.type === "restStart") return { state: "rest", since: last.ts };
      const sessions = buildSessions(evs, cfg);
      const open = sessions.find((s) => s.open);
      return { state: "in", since: open ? open.start : last.ts };
    },
    [eventsFor, cfg]
  );

  const dueFor = useCallback(
    (empId) => {
      const open = sessionsToday(empId).find((s) => s.open);
      return open ? nextBreakDue(open, cfg, now) : null;
    },
    [sessionsToday, cfg, now]
  );

  const todayMs = useCallback(
    (empId) => {
      const start = new Date();
      start.setHours(0, 0, 0, 0);
      const evs = eventsFor(empId).filter((e) => e.ts >= start.getTime());
      const sessions = buildSessions(evs, cfg);
      return sessions.reduce((a, s) => a + sessionWorkedMs(s, cfg, now), 0);
    },
    [eventsFor, cfg, now]
  );

  /* punch flow */
  const handleEmployeeTap = (emp) => {
    setPinErr("");
    setPinFor(emp);
    cam.start(); // warm the camera up while they type their PIN
  };
  const closePunchFlow = () => {
    setPinFor(null);
    setActionFor(null);
    setShowSchedule(null);
    setPinErr("");
    cam.stop();
  };
  const submitEmployeePin = (v) => {
    if (!pinFor) return;
    if (v !== pinFor.pin) {
      setPinErr("That PIN doesn't match. Try again.");
      return;
    }
    setPinErr("");
    setActionFor(pinFor);
    setPinFor(null);
  };
  const doPunch = async (type) => {
    const emp = actionFor;
    const shot = cfg.photos ? cam.capture() : null;
    if (cfg.photos && cfg.photoRequired && !shot) {
      flash("Camera isn't working — get a manager to punch you in", "out");
      return;
    }
    setActionFor(null);
    cam.stop();
    const ev = await addEvent(emp.id, type, null, shot);
    const t = fmtTime(new Date(ev.ts));
    const label = {
      in: `${emp.name} clocked in at ${t}`,
      out: `${emp.name} clocked out at ${t}`,
      mealStart: `${emp.name} started lunch at ${t}`,
      mealEnd: `${emp.name} back from lunch at ${t}`,
      restStart: `${emp.name} on rest break at ${t}`,
      restEnd: `${emp.name} back from rest break at ${t}`,
    }[type];
    flash(label, type === "out" ? "out" : "in");

    if (type === "out") {
      const shown = await checkBreaks(emp, ev);
      if (shown) return; // period review runs after the break questions
    }
    if (cfg.attestation) await maybeReview(emp, type, ev);
  };

  /* Ask about breaks only when the day actually fell short. */
  const checkBreaks = useCallback(
    async (emp, ev) => {
      if (!cfg.breakRules) return false;
      const dStart = new Date(ev.ts);
      dStart.setHours(0, 0, 0, 0);
      const evs = Object.values(monthsRef.current)
        .flat()
        .filter((x) => x.empId === emp.id && x.ts >= dStart.getTime());
      const sessions = buildSessions(evs, cfg);
      if (!sessions.length) return false;
      const comp = breakCompliance(sessions, cfg, Date.now(), null, emp);
      const needs = (comp.meal1 && !comp.meal1.ok) || comp.restsOwed > comp.restsTaken;
      if (!needs) return false;
      setBreakAsk({ emp, comp, day: dayKey(dStart), ev });
      return true;
    },
    [cfg]
  );

  const submitBreakAttest = async (answers) => {
    if (!breakAsk) return;
    const { emp, day, ev } = breakAsk;
    await addEvent(emp.id, "breakAttest", ev.ts + 1, null, {
      day,
      meal1: answers.meal1 || null,
      rest: answers.rest || null,
      note: answers.note || "",
    });
    setBreakAsk(null);
    const owed = answers.meal1 === "denied" || answers.rest === "denied";
    flash(
      owed ? "Logged — an hour of premium pay was flagged for you" : "Thanks, logged",
      owed ? "out" : "in"
    );
    if (cfg.attestation) await maybeReview(emp, "out", ev);
  };

  /* Sign-off is due when someone clocks out on the last day of the pay period.
     If they miss it, we catch them at the next punch instead of losing it. */
  const maybeReview = useCallback(
    async (emp, type, ev) => {
      const when = new Date(ev.ts);
      let target = null;

      if (type === "out" && isLastDayOfPeriod(cfg, when)) {
        target = startOfWeek(when, cfg.weekStart);
      } else {
        const prior = startOfWeek(addDays(when, -7), cfg.weekStart);
        const priorEnd = addDays(prior, 7).getTime();
        if (when.getTime() >= priorEnd) target = prior;
      }
      if (!target) return;

      const key = attestKeyFor(dayKey(target), emp.id);
      const already = await sGet(key, null);
      if (already) return;

      // read from the ref, not state — the clock-out that triggered this
      // review was written milliseconds ago and must be included
      const evs = Object.values(monthsRef.current)
        .flat()
        .filter((x) => x.empId === emp.id);
      const summary = periodSummary(evs, cfg, target, Date.now());
      if (summary.totals.total === 0) return;

      setReview({ emp, periodStartDate: target, summary, key });
    },
    [cfg]
  );

  const submitReview = async ({ agreed, signature, note }) => {
    if (!review) return;
    const { emp, periodStartDate, summary, key } = review;
    const pStart = dayKey(periodStartDate);
    const record = {
      empId: emp.id,
      empName: emp.name,
      periodStart: pStart,
      periodEnd: dayKey(periodEnd(cfg, periodStartDate)),
      signedAt: Date.now(),
      agreed,
      note: note || "",
      totals: summary.totals,
      dayHours: summary.rows.map((r) => ({ d: dayKey(r.date), h: r.hours })),
    };
    if (signature) {
      const sk = signKeyFor(pStart, emp.id);
      const ok = await sSet(sk, signature);
      if (ok) record.signatureKey = sk;
    }
    await sSet(key, record);
    setReview(null);
    flash(
      agreed ? "Signed — thanks, hours confirmed" : "Sent to your manager for review",
      agreed ? "in" : "out"
    );
  };

  if (!ready) {
    return (
      <div className="root">
        <Styles />
        <div className="bootWrap">
          <div className="bootPulse" />
          <p className="bootTxt">Opening the shop…</p>
        </div>
      </div>
    );
  }

  if (screen === "setup") {
    return (
      <div className="root">
        <Styles />
        <Setup
          cfg={cfg}
          onDone={async (next) => {
            await saveCfg(next);
            setScreen("kiosk");
          }}
        />
      </div>
    );
  }

  if (screen === "manager") {
    return (
      <div className="root">
        <Styles />
        <Manager
          cfg={cfg}
          employees={employees}
          months={months}
          loadMonth={loadMonth}
          updateEvents={updateEvents}
          saveCfg={saveCfg}
          saveEmployees={saveEmployees}
          onExit={() => setScreen("kiosk")}
          flash={flash}
          now={now}
        />
        <Toast text={toast?.text} tone={toast?.tone} />
      </div>
    );
  }

  const active = employees.filter((e) => e.active !== false);
  const nowDate = new Date(now);

  return (
    <div className="root">
      <Styles />

      <header className="bar">
        <div className="barLeft">
          <h1 className="shopName">{cfg.shopName}</h1>
          <p className="barDate">{fmtDateLong(nowDate)}</p>
        </div>
        <div className="barRight">
          <div className="bigClock">{fmtTime(nowDate)}</div>
          <div className="onNow">
            {active.filter((e) => statusOf(e.id).state !== "out").length} on the clock
          </div>
        </div>
      </header>

      {cfg.breakRules &&
        (() => {
          const alerts = active
            .map((e) => ({ emp: e, due: dueFor(e.id) }))
            .filter(
              (a) =>
                a.due &&
                (a.due.kind === "meal1" || a.due.kind === "meal2") &&
                a.due.remaining < cfg.breakReminderMin * 60000
            )
            .sort((a, b) => a.due.remaining - b.due.remaining);
          if (!alerts.length) return null;
          return (
            <div className="floorAlert">
              {alerts.map(({ emp, due }) => (
                <span key={emp.id} className={`floorItem ${due.remaining < 0 ? "over" : ""}`}>
                  <strong>{emp.name.split(" ")[0]}</strong>
                  {due.remaining < 0
                    ? ` — lunch is past the legal cutoff of ${fmtTime(new Date(due.dueAt))}`
                    : ` — lunch due in ${Math.max(0, Math.round(due.remaining / 60000))} min`}
                </span>
              ))}
            </div>
          );
        })()}

      {active.length === 0 ? (
        <div className="empty">
          <h2>No one on the roster yet</h2>
          <p>Add your technicians and give each one a 4-digit PIN. Then they can punch in here.</p>
          <button className="btn primary lg" onClick={() => setManagerPin(true)}>
            Add your team
          </button>
        </div>
      ) : (
        <main className="grid">
          {active.map((emp) => {
            const st = statusOf(emp.id);
            const worked = todayMs(emp.id);
            const due = cfg.breakRules ? dueFor(emp.id) : null;
            return (
              <button
                key={emp.id}
                className={`tile ${st.state}`}
                onClick={() => handleEmployeeTap(emp)}
              >
                <span className="tileRule" />
                <span className="tileTop">
                  <span className="tileName">{emp.name}</span>
                  <span className="tileRole">{emp.role || "Technician"}</span>
                </span>

                <DayBar
                  cfg={cfg}
                  sessions={buildSessions(
                    eventsFor(emp.id).filter((e) => {
                      const s = new Date();
                      s.setHours(0, 0, 0, 0);
                      return e.ts >= s.getTime();
                    }),
                    cfg
                  )}
                  now={now}
                />

                <span className="tileBottom">
                  <span className={`pill ${st.state}`}>
                    {st.state === "in"
                      ? "On the clock"
                      : st.state === "meal"
                      ? "At lunch"
                      : st.state === "rest"
                      ? "Rest break"
                      : "Out"}
                  </span>
                  <span className="tileHrs">{hoursText(worked)} today</span>
                </span>

                {due && (
                  <span
                    className={`tileDue ${
                      due.kind === "onMeal" || due.kind === "onRest"
                        ? "timer"
                        : due.remaining < 0
                        ? "over"
                        : due.remaining < cfg.breakReminderMin * 60000
                        ? "soon"
                        : ""
                    }`}
                  >
                    {due.kind === "onMeal"
                      ? due.remaining > 0
                        ? `${Math.ceil(due.remaining / 60000)} min left of lunch`
                        : "Full lunch taken"
                      : due.kind === "onRest"
                      ? due.remaining > 0
                        ? `${Math.ceil(due.remaining / 60000)} min left of rest break`
                        : "Rest break complete"
                      : due.remaining < 0
                      ? `${due.label} — past ${fmtTime(new Date(due.dueAt))}`
                      : `${due.label} by ${fmtTime(new Date(due.dueAt))}`}
                  </span>
                )}
              </button>
            );
          })}
        </main>
      )}

      <footer className="foot">
        <button className="linkBtn" onClick={() => setManagerPin(true)}>
          Manager
        </button>
        <span className="footNote">Tap your name to punch in or out</span>
      </footer>

      {pinFor && (
        <Keypad
          title={pinFor.name}
          subtitle="Enter your 4-digit PIN"
          error={pinErr}
          onSubmit={submitEmployeePin}
          onCancel={closePunchFlow}
          cam={cfg.photos ? cam : null}
        />
      )}

      {managerPin && (
        <Keypad
          title="Manager"
          subtitle="Enter the manager PIN"
          error={pinErr}
          onSubmit={(v) => {
            if (v === cfg.managerPin) {
              setManagerPin(false);
              setPinErr("");
              setScreen("manager");
            } else {
              setPinErr("Wrong PIN.");
            }
          }}
          onCancel={() => {
            setManagerPin(false);
            setPinErr("");
          }}
        />
      )}

      {actionFor && (
        <ActionSheet
          emp={actionFor}
          status={statusOf(actionFor.id)}
          worked={todayMs(actionFor.id)}
          onPunch={doPunch}
          onCancel={closePunchFlow}
          cam={cfg.photos ? cam : null}
          due={cfg.breakRules ? dueFor(actionFor.id) : null}
          now={now}
          cfg={cfg}
          onSchedule={() => {
            setShowSchedule(actionFor);
            setActionFor(null);
            cam.stop();
          }}
        />
      )}

      {showSchedule && (
        <MySchedule
          emp={showSchedule}
          cfg={cfg}
          onClose={() => setShowSchedule(null)}
        />
      )}

      {breakAsk && (
        <BreakAttest
          emp={breakAsk.emp}
          comp={breakAsk.comp}
          onSubmit={submitBreakAttest}
          onSkip={() => setBreakAsk(null)}
        />
      )}

      {review && (
        <ReviewSheet
          emp={review.emp}
          cfg={cfg}
          summary={review.summary}
          periodStartDate={review.periodStartDate}
          onSubmit={submitReview}
          onDefer={() => setReview(null)}
        />
      )}

      <Toast text={toast?.text} tone={toast?.tone} />
    </div>
  );
}

/* ---------- day bar (shop hours timeline) ---------- */
function DayBar({ cfg, sessions, now }) {
  const start = new Date();
  start.setHours(cfg.openHour, 0, 0, 0);
  const end = new Date();
  end.setHours(cfg.closeHour, 0, 0, 0);
  const span = end - start;
  if (span <= 0) return null;
  const segs = [];
  sessions.forEach((s, i) => {
    const a = Math.max(s.start, start.getTime());
    const b = Math.min(s.end != null ? s.end : now, end.getTime());
    if (b > a) {
      segs.push({
        key: `w${i}`,
        left: ((a - start.getTime()) / span) * 100,
        width: ((b - a) / span) * 100,
        kind: "work",
      });
    }
    [
      ["meal", s.meals || []],
      ["rest", s.rests || []],
    ].forEach(([kind, list]) => {
      list.forEach((br, j) => {
        const ba = Math.max(br.start, start.getTime());
        const bb = Math.min(br.end, end.getTime());
        if (bb > ba)
          segs.push({
            key: `${kind}${i}-${j}`,
            left: ((ba - start.getTime()) / span) * 100,
            width: ((bb - ba) / span) * 100,
            kind,
          });
      });
    });
  });
  const nowPct = ((now - start.getTime()) / span) * 100;
  return (
    <span className="daybar">
      <span className="daybarTrack" />
      {segs.map((s) => (
        <span
          key={s.key}
          className={`daybarSeg ${s.kind}`}
          style={{ left: `${s.left}%`, width: `${Math.max(s.width, 0.6)}%` }}
        />
      ))}
      {nowPct >= 0 && nowPct <= 100 && (
        <span className="daybarNow" style={{ left: `${nowPct}%` }} />
      )}
      <span className="daybarEnds">
        <em>{cfg.openHour % 12 || 12}a</em>
        <em>{cfg.closeHour > 12 ? cfg.closeHour - 12 : cfg.closeHour}p</em>
      </span>
    </span>
  );
}

/* ---------- action sheet ---------- */
function ActionSheet({ emp, status, worked, onPunch, onCancel, cam, due, now, cfg, onSchedule }) {
  const isOut = status.state === "out";
  const onMeal = status.state === "meal";
  const onRest = status.state === "rest";
  const onClock = !isOut && !onMeal && !onRest;

  const mealElapsed = onMeal ? now - status.since : 0;
  const restElapsed = onRest ? now - status.since : 0;
  const mealShort = onMeal && mealElapsed < MEAL_MIN_MS - 30000;
  const [confirmShort, setConfirmShort] = useState(false);

  const mealLeft = Math.max(0, MEAL_MIN_MS - mealElapsed);
  const restLeft = Math.max(0, REST_MIN_MS - restElapsed);
  const mmss = (ms) =>
    `${Math.floor(ms / 60000)}:${pad2(Math.floor((ms % 60000) / 1000))}`;

  return (
    <div className="overlay">
      <div className="actCard">
        <button className="closeX" onClick={onCancel} aria-label="Cancel">
          ✕
        </button>
        {cam && <CameraFeed cam={cam} size="lg" />}
        <h2 className="actName">{emp.name}</h2>
        <p className="actMeta">
          {isOut
            ? "Not on the clock"
            : onMeal
            ? `On lunch since ${fmtTime(new Date(status.since))}`
            : onRest
            ? `On rest break since ${fmtTime(new Date(status.since))}`
            : `Clocked in at ${fmtTime(new Date(status.since))} · ${hoursText(worked)} today`}
        </p>

        {onMeal && (
          <div className={`breakTimer ${mealShort ? "short" : "done"}`}>
            <strong>{mealShort ? mmss(mealLeft) : "30:00+"}</strong>
            <span>
              {mealShort
                ? "left before your lunch counts as a full 30"
                : cfg?.mealPay === "always"
                ? "you've had a full lunch — head back whenever you're ready"
                : "you've had a full lunch — clock back in when ready"}
            </span>
          </div>
        )}
        {onRest && (
          <div className={`breakTimer ${restLeft > 0 ? "short" : "done"}`}>
            <strong>{restLeft > 0 ? mmss(restLeft) : "10:00+"}</strong>
            <span>
              {restLeft > 0 ? "left on your paid rest break" : "rest break complete"}
            </span>
          </div>
        )}

        {onClock && due && due.remaining < 60 * 60000 && (
          <div className={`dueBanner ${due.remaining < 0 ? "over" : ""}`}>
            {due.remaining < 0
              ? `${due.label} — it's past the legal cutoff of ${fmtTime(new Date(due.dueAt))}`
              : `${due.label} by ${fmtTime(new Date(due.dueAt))} · ${Math.round(
                  due.remaining / 60000
                )} min left`}
          </div>
        )}

        <div className="actBtns">
          {isOut && (
            <button className="bigAct in" onClick={() => onPunch("in")}>
              Clock in
            </button>
          )}
          {onClock && (
            <>
              <button className="bigAct meal" onClick={() => onPunch("mealStart")}>
                Start lunch
                <em>
                  {cfg?.mealPay === "always"
                    ? "30 minutes, paid — you're free to leave"
                    : "30 minutes, off the clock"}
                </em>
              </button>
              <button className="bigAct brk" onClick={() => onPunch("restStart")}>
                Start rest break
                <em>10 minutes, paid — stay on the clock</em>
              </button>
              <button className="bigAct out" onClick={() => onPunch("out")}>
                Clock out
              </button>
            </>
          )}
          {onMeal && !confirmShort && (
            <button
              className="bigAct in"
              onClick={() => (mealShort ? setConfirmShort(true) : onPunch("mealEnd"))}
            >
              Back from lunch
            </button>
          )}
          {onMeal && confirmShort && (
            <div className="shortWarn">
              <p>
                That's only {Math.floor(mealElapsed / 60000)} minutes. California requires a full 30,
                and coming back early can cost the shop an hour of premium pay.
              </p>
              <button className="bigAct in" onClick={() => setConfirmShort(false)}>
                Finish my lunch
              </button>
              <button className="bigAct out" onClick={() => onPunch("mealEnd")}>
                Go back to work anyway
              </button>
            </div>
          )}
          {onRest && (
            <button className="bigAct in" onClick={() => onPunch("restEnd")}>
              Back from rest break
            </button>
          )}
          {(onMeal || onRest) && !confirmShort && (
            <button className="bigAct out" onClick={() => onPunch("out")}>
              Clock out for the day
            </button>
          )}
          {!confirmShort && (
            <button className="linkBtn wide" onClick={onSchedule}>
              See my schedule
            </button>
          )}
        </div>
        {cam && cam.state !== "live" && (
          <p className="camNote">{CAM_MSG[cam.state] || "Camera off"}</p>
        )}
      </div>
    </div>
  );
}

/* ---------- setup ---------- */
function Setup({ cfg, onDone }) {
  const [name, setName] = useState(cfg.shopName || "");
  const [pin, setPin] = useState("");
  const [pin2, setPin2] = useState("");
  const [err, setErr] = useState("");
  const go = () => {
    if (!name.trim()) return setErr("Give the shop a name.");
    if (!/^\d{4}$/.test(pin)) return setErr("The manager PIN needs to be 4 digits.");
    if (pin !== pin2) return setErr("The two PINs don't match.");
    onDone({ ...cfg, shopName: name.trim(), managerPin: pin });
  };
  return (
    <div className="setupWrap">
      <div className="setupCard">
        <h1 className="setupTitle">Set up the time clock</h1>
        <p className="setupLead">
          This runs on the shop iPad. Your crew taps their name and enters a PIN to punch in and out.
        </p>
        <label className="fld">
          <span>Shop name</span>
          <input value={name} onChange={(e) => setName(e.target.value)} placeholder="Shop name" />
        </label>
        <label className="fld">
          <span>Manager PIN</span>
          <input
            value={pin}
            onChange={(e) => setPin(e.target.value.replace(/\D/g, "").slice(0, 4))}
            inputMode="numeric"
            placeholder="4 digits"
          />
        </label>
        <label className="fld">
          <span>Confirm manager PIN</span>
          <input
            value={pin2}
            onChange={(e) => setPin2(e.target.value.replace(/\D/g, "").slice(0, 4))}
            inputMode="numeric"
            placeholder="4 digits"
          />
        </label>
        {err && <p className="fldErr">{err}</p>}
        <button className="btn primary lg full" onClick={go}>
          Start the clock
        </button>
        <p className="setupNote">
          The manager PIN opens timecards, the roster, and settings. Keep it off the shop floor.
        </p>
      </div>
    </div>
  );
}
