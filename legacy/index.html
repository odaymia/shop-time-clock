/* ---------- schedule builder ---------- */
function ScheduleBuilder({ cfg, employees, flash }) {
  const [offset, setOffset] = useState(0);
  const [sched, setSched] = useState(undefined);
  const [editing, setEditing] = useState(null);
  const weekStart = addDays(startOfWeek(new Date(), cfg.weekStart), offset * 7);
  const key = schedKeyFor(dayKey(weekStart));
  const days = Array.from({ length: 7 }, (_, i) => addDays(weekStart, i));
  const roster = employees.filter((e) => e.active !== false);

  useEffect(() => {
    let dead = false;
    setSched(undefined);
    (async () => {
      const s = await sGet(key, null);
      if (!dead) setSched(s || { published: false, shifts: {} });
    })();
    return () => {
      dead = true;
    };
  }, [key]);

  const persist = async (next) => {
    setSched(next);
    await sSet(key, next);
  };

  const setShift = async (empId, dKey, shift) => {
    const next = { ...sched, shifts: { ...(sched.shifts || {}) } };
    const forEmp = { ...(next.shifts[empId] || {}) };
    if (shift) forEmp[dKey] = shift;
    else delete forEmp[dKey];
    next.shifts[empId] = forEmp;
    await persist(next);
  };

  const copyLastWeek = async () => {
    const prev = await sGet(schedKeyFor(dayKey(addDays(weekStart, -7))), null);
    if (!prev || !prev.shifts) return flash("Nothing to copy from last week", "out");
    const shifts = {};
    for (const [empId, byDay] of Object.entries(prev.shifts)) {
      shifts[empId] = {};
      for (const [dk, sh] of Object.entries(byDay)) {
        const shifted = dayKey(addDays(new Date(`${dk}T12:00:00`), 7));
        shifts[empId][shifted] = sh;
      }
    }
    await persist({ ...sched, shifts });
    flash("Copied last week's schedule");
  };

  const clearWeek = async () => {
    await persist({ ...sched, shifts: {} });
    flash("Week cleared");
  };

  const togglePublish = async () => {
    const now = Date.now();
    const next = { ...sched, published: !sched.published, publishedAt: now };
    await persist(next);
    flash(next.published ? "Schedule posted — your crew can see it" : "Schedule unposted");
  };

  if (sched === undefined) return <div className="pane"><p className="muted">Loading…</p></div>;

  const empHours = (empId) =>
    days.reduce((a, d) => a + shiftHours(sched.shifts?.[empId]?.[dayKey(d)], cfg), 0);
  const dayHeads = (d) =>
    roster.filter((e) => sched.shifts?.[e.id]?.[dayKey(d)]).length;
  const weekTotal = roster.reduce((a, e) => a + empHours(e.id), 0);

  return (
    <div className="pane">
      <div className="weekNav">
        <button className="btn ghost" onClick={() => setOffset((o) => o - 1)}>
          ‹ Previous
        </button>
        <div className="weekLabel">
          <strong>
            {weekStart.toLocaleDateString(undefined, { month: "short", day: "numeric" })} –{" "}
            {addDays(weekStart, 6).toLocaleDateString(undefined, {
              month: "short",
              day: "numeric",
            })}
          </strong>
          <span>
            {offset === 0 ? "This week" : offset === 1 ? "Next week" : `${offset} weeks out`}
          </span>
        </div>
        <button className="btn ghost" onClick={() => setOffset((o) => o + 1)}>
          Next ›
        </button>
        <button className="btn" onClick={copyLastWeek}>
          Copy last week
        </button>
        <button className={`btn ${sched.published ? "" : "primary"}`} onClick={togglePublish}>
          {sched.published ? "Unpost" : "Post to the crew"}
        </button>
      </div>

      <div className={`postState ${sched.published ? "live" : ""}`}>
        {sched.published
          ? "Posted. Your crew sees this when they tap their name and enter their PIN. Any change you make here shows up right away."
          : "Not posted yet. Nobody can see this until you post it."}
      </div>

      {roster.length === 0 ? (
        <p className="muted pad">Add people to the roster first.</p>
      ) : (
        <div className="tableWrap">
          <table className="tc sched">
            <thead>
              <tr>
                <th className="stick">Name</th>
                {days.map((d) => (
                  <th key={dayKey(d)}>
                    {d.toLocaleDateString(undefined, { weekday: "short" })}
                    <em>{d.getDate()}</em>
                  </th>
                ))}
                <th>Hours</th>
              </tr>
            </thead>
            <tbody>
              {roster.map((e) => {
                const hrs = empHours(e.id);
                return (
                  <tr key={e.id}>
                    <td className="stick nameCell">{e.name}</td>
                    {days.map((d) => {
                      const k = dayKey(d);
                      const sh = sched.shifts?.[e.id]?.[k];
                      return (
                        <td key={k} className="cellPad">
                          <button
                            className={`schedCell ${sh ? "on" : ""}`}
                            onClick={() => setEditing({ emp: e, dKey: k, date: d, shift: sh })}
                          >
                            {sh ? (
                              <>
                                <span>
                                  {fmtHHMM(sh.start)}–{fmtHHMM(sh.end)}
                                </span>
                                {sh.note && <em>{sh.note}</em>}
                              </>
                            ) : (
                              <span className="addMark">+</span>
                            )}
                          </button>
                        </td>
                      );
                    })}
                    <td className={`num tot ${hrs > 40 ? "ot" : ""}`}>{hrs.toFixed(1)}</td>
                  </tr>
                );
              })}
              <tr className="coverRow">
                <td className="stick">On the floor</td>
                {days.map((d) => {
                  const n = dayHeads(d);
                  return (
                    <td
                      key={dayKey(d)}
                      className={n > 0 && n < cfg.minStaff ? "hot" : n === 0 ? "zero" : ""}
                    >
                      {n === 0 ? "—" : n}
                    </td>
                  );
                })}
                <td className="num tot">{weekTotal.toFixed(1)}</td>
              </tr>
            </tbody>
          </table>
        </div>
      )}

      {(() => {
        const thin = days.filter((d) => {
          const n = dayHeads(d);
          return n > 0 && n < cfg.minStaff;
        });
        const over = roster.filter((e) => empHours(e.id) > 40);
        if (!thin.length && !over.length) return null;
        return (
          <div className="schedWarn">
            {thin.length > 0 && (
              <p>
                Below your {cfg.minStaff}-person floor minimum on{" "}
                {thin.map((d) => d.toLocaleDateString(undefined, { weekday: "long" })).join(", ")}.
              </p>
            )}
            {over.map((e) => (
              <p key={e.id}>
                {e.name} is scheduled {empHours(e.id).toFixed(1)} hours — anything past 40 comes back
                at time and a half.
              </p>
            ))}
          </div>
        );
      })()}

      <div className="schedFoot">
        <button className="btn tiny danger" onClick={clearWeek}>
          Clear this week
        </button>
      </div>

      {editing && (
        <ShiftEditor
          cfg={cfg}
          entry={editing}
          onSave={(sh) => {
            setShift(editing.emp.id, editing.dKey, sh);
            setEditing(null);
          }}
          onClose={() => setEditing(null)}
        />
      )}
    </div>
  );
}

function ShiftEditor({ cfg, entry, onSave, onClose }) {
  const existing = entry.shift;
  const [start, setStart] = useState(existing?.start || `${pad2(cfg.openHour)}:00`);
  const [end, setEnd] = useState(existing?.end || `${pad2(cfg.closeHour)}:00`);
  const [lunch, setLunch] = useState(existing?.lunch ?? 30);
  const [note, setNote] = useState(existing?.note || "");

  const preview = shiftHours({ start, end, lunch }, cfg);
  const bad = preview <= 0;

  return (
    <div className="overlay">
      <div className="editCard">
        <button className="closeX" onClick={onClose} aria-label="Close">
          ✕
        </button>
        <h2 className="editTitle">{entry.emp.name}</h2>
        <p className="muted">
          {entry.date.toLocaleDateString(undefined, {
            weekday: "long",
            month: "long",
            day: "numeric",
          })}
        </p>

        <div className="presetRow">
          {SHIFT_PRESETS.map((p) => (
            <button
              key={p.label}
              className="btn tiny"
              onClick={() => {
                setStart(p.start);
                setEnd(p.end);
                setLunch(p.lunch);
              }}
            >
              {p.label}
            </button>
          ))}
        </div>

        <div className="fldRow">
          <label className="fld">
            <span>Starts</span>
            <input type="time" value={start} onChange={(e) => setStart(e.target.value)} />
          </label>
          <label className="fld">
            <span>Ends</span>
            <input type="time" value={end} onChange={(e) => setEnd(e.target.value)} />
          </label>
        </div>
        <div className="fldRow">
          <label className="fld">
            <span>Unpaid lunch</span>
            <select value={lunch} onChange={(e) => setLunch(Number(e.target.value))}>
              <option value={0}>None</option>
              <option value={30}>30 minutes</option>
              <option value={45}>45 minutes</option>
              <option value={60}>60 minutes</option>
            </select>
          </label>
          <label className="fld">
            <span>Note (they'll see this)</span>
            <input
              value={note}
              onChange={(e) => setNote(e.target.value)}
              placeholder="Cover front counter"
            />
          </label>
        </div>

        <p className={`shiftPreview ${bad ? "bad" : ""}`}>
          {bad ? "End time has to come after the start." : `${preview.toFixed(2)} paid hours`}
          {!bad && preview > 8 ? " · over 8, so daily overtime kicks in" : ""}
        </p>

        <button
          className="btn primary lg full"
          disabled={bad}
          onClick={() => onSave({ start, end, lunch, note: note.trim() })}
        >
          {existing ? "Save shift" : "Add shift"}
        </button>
        {existing && (
          <button className="linkBtn wide" onClick={() => onSave(null)}>
            Remove this shift
          </button>
        )}
      </div>
    </div>
  );
}

/* ---------- timecards ---------- */
function Timecards({ cfg, employees, months, loadMonth, updateEvents, now, flash }) {
  const [weekOffset, setWeekOffset] = useState(0);
  const [openEmp, setOpenEmp] = useState(null);
  const [csv, setCsv] = useState(null);
  const [editing, setEditing] = useState(null);
  const [attest, setAttest] = useState({});
  const [viewSign, setViewSign] = useState(null);
  const [breakDetail, setBreakDetail] = useState(null);
  const [view, setView] = useState("hours"); // hours | variance
  const [sched, setSched] = useState(null);
  const [varDetail, setVarDetail] = useState(null);

  const weekStartDate = addDays(startOfWeek(new Date(), cfg.weekStart), weekOffset * 7);
  const weekEndDate = addDays(weekStartDate, 6);
  const wStart = weekStartDate.getTime();
  const wEnd = addDays(weekStartDate, 7).getTime();

  useEffect(() => {
    loadMonth(ym(weekStartDate));
    loadMonth(ym(weekEndDate));
  }, [weekOffset]); // eslint-disable-line

  useEffect(() => {
    let dead = false;
    (async () => {
      const s = await sGet(schedKeyFor(dayKey(weekStartDate)), null);
      if (!dead) setSched(s);
    })();
    return () => {
      dead = true;
    };
  }, [weekOffset]); // eslint-disable-line

  useEffect(() => {
    let dead = false;
    (async () => {
      const pStart = dayKey(weekStartDate);
      const found = {};
      for (const e of employees) {
        const rec = await sGet(attestKeyFor(pStart, e.id), null);
        if (rec) found[e.id] = rec;
      }
      if (!dead) setAttest(found);
    })();
    return () => {
      dead = true;
    };
  }, [weekOffset, employees]); // eslint-disable-line

  const all = Object.values(months).flat();
  const days = Array.from({ length: 7 }, (_, i) => addDays(weekStartDate, i));

  const rowFor = (emp) => {
    const evs = all.filter((e) => e.empId === emp.id).sort((a, b) => a.ts - b.ts);
    const attests = evs.filter((e) => e.type === "breakAttest");
    const sessions = buildSessions(evs, cfg).filter((s) => s.start >= wStart && s.start < wEnd);
    const byDay = {};
    for (const s of sessions) {
      const k = dayKey(new Date(s.start));
      byDay[k] = byDay[k] || { ms: 0, breakMs: 0, sessions: [] };
      byDay[k].ms += sessionWorkedMs(s, cfg, now);
      byDay[k].breakMs += sessionBreakMs(s, now);
      byDay[k].sessions.push(s);
    }
    const dayHours = days.map((d) => decHours(byDay[dayKey(d)]?.ms || 0));
    const totals = weekTotals(dayHours, cfg.otRules);
    const paidMealMs = sessions.reduce((a, s) => a + sessionPaidMealMs(s, cfg), 0);
    const paidMealCount = sessions.reduce(
      (a, s) => a + s.meals.filter((m) => mealIsPaid(m, cfg)).length,
      0
    );

    let mealPrem = 0,
      restPrem = 0;
    const flags = [];
    if (cfg.breakRules) {
      for (const d of days) {
        const k = dayKey(d);
        const info = byDay[k];
        if (!info) continue;
        const att = attests.find((a) => a.payload?.day === k)?.payload || null;
        const comp = breakCompliance(info.sessions, cfg, now, att, emp);
        info.comp = comp;
        info.attested = !!att;
        mealPrem += comp.mealPremium;
        restPrem += comp.restPremium;
        if (comp.issues.length) flags.push({ day: k, date: d, comp, att });
      }
    }

    const anomalies = sessions.filter((s) => s.missingOut).length;

    /* --- scheduled vs actual --- */
    const grace = (cfg.graceMin || 0) * 60000;
    const mine = sched?.shifts?.[emp.id] || {};
    const variance = days.map((d, i) => {
      const k = dayKey(d);
      const shift = mine[k];
      const schedH = shiftHours(shift, cfg);
      const actualH = dayHours[i];
      const info = byDay[k];
      const row = {
        date: d,
        day: k,
        shift,
        schedH,
        actualH,
        diff: Math.round((actualH - schedH) * 100) / 100,
        notes: [],
        kind: null,
      };
      if (shift && actualH === 0) {
        row.notes.push("Scheduled but never clocked in");
        row.kind = "noshow";
      } else if (!shift && actualH > 0) {
        row.notes.push("Worked without being on the schedule");
        row.kind = "unscheduled";
      } else if (shift && info) {
        const firstIn = Math.min(...info.sessions.map((s) => s.start));
        const lastOut = Math.max(
          ...info.sessions.map((s) => (s.end != null ? s.end : s.start))
        );
        const sStart = schedTs(d, shift.start);
        const sEnd = schedTs(d, shift.end, sStart);
        if (sStart && firstIn > sStart + grace)
          row.notes.push(`In ${Math.round((firstIn - sStart) / 60000)} min late`);
        if (sStart && firstIn < sStart - grace)
          row.notes.push(`In ${Math.round((sStart - firstIn) / 60000)} min early`);
        if (sEnd && lastOut > sEnd + grace)
          row.notes.push(`Stayed ${Math.round((lastOut - sEnd) / 60000)} min past the end`);
        if (sEnd && lastOut < sEnd - grace)
          row.notes.push(`Left ${Math.round((sEnd - lastOut) / 60000)} min early`);
        if (row.notes.length) row.kind = row.diff > 0 ? "over" : "under";
      }
      return row;
    });
    const schedTotal = Math.round(variance.reduce((a, v) => a + v.schedH, 0) * 100) / 100;
    const varTotal = Math.round((totals.total - schedTotal) * 100) / 100;

    return {
      byDay,
      dayHours,
      totals,
      anomalies,
      sessions,
      mealPrem,
      restPrem,
      flags,
      paidMealMs,
      paidMealCount,
      variance,
      schedTotal,
      varTotal,
    };
  };

  const rows = employees.map((e) => ({ emp: e, ...rowFor(e) }));
  const buildCsv = () => {
    const lines = [
      [
        "Employee",
        "Date",
        "Clock in",
        "Clock out",
        "Lunch (min)",
        "Lunch paid",
        "Rest breaks",
        "Hours",
        "Scheduled",
        "Variance",
        "Regular",
        "OT",
        "Double",
        "Meal premium",
        "Rest premium",
        "Break note",
      ].join(","),
    ];
    for (const r of rows) {
      days.forEach((d, i) => {
        const k = dayKey(d);
        const info = r.byDay[k];
        if (!info) return;
        const split = splitDay(r.dayHours[i], cfg.otRules);
        const comp = info.comp;
        info.sessions.forEach((s, si) => {
          lines.push(
            [
              `"${r.emp.name}"`,
              k,
              fmtTime(new Date(s.start)),
              s.end ? fmtTime(new Date(s.end)) : s.missingOut ? "MISSING" : "still in",
              Math.round(sessionMealMs(s, now) / 60000),
              s.meals.some((m) => mealIsPaid(m, cfg))
                ? "paid"
                : s.meals.length
                ? "unpaid"
                : "",
              s.rests.length,
              si === 0 ? r.dayHours[i] : "",
              si === 0 ? r.variance[i].schedH.toFixed(2) : "",
              si === 0 ? r.variance[i].diff.toFixed(2) : "",
              si === 0 ? split.reg.toFixed(2) : "",
              si === 0 ? split.ot.toFixed(2) : "",
              si === 0 ? split.dt.toFixed(2) : "",
              si === 0 && comp ? comp.mealPremium : "",
              si === 0 && comp ? comp.restPremium : "",
              si === 0 && comp && comp.issues.length ? `"${comp.issues.join("; ")}"` : "",
            ].join(",")
          );
        });
      });
      lines.push(
        [
          `"${r.emp.name}"`,
          "WEEK TOTAL",
          "",
          "",
          "",
          "",
          "",
          r.totals.total,
          r.schedTotal.toFixed(2),
          r.varTotal.toFixed(2),
          r.totals.reg,
          r.totals.ot,
          r.totals.dt,
          r.mealPrem,
          r.restPrem,
          "",
        ].join(",")
      );
    }
    setCsv(lines.join("\n"));
  };

  const togglePaidMeal = async (ev) => {
    const key = ym(new Date(ev.ts));
    const list = (months[key] || []).map((x) =>
      x.id === ev.id ? { ...x, paidMeal: !x.paidMeal } : x
    );
    await updateEvents(key, list);
    flash(ev.paidMeal ? "Lunch set back to unpaid" : "Lunch is on the shop — 30 min added");
  };

  const deleteEvent = async (ev) => {
    const key = ym(new Date(ev.ts));
    const list = (months[key] || []).filter((x) => x.id !== ev.id);
    await updateEvents(key, list);
    flash("Punch deleted");
  };

  return (
    <div className="pane">
      <div className="weekNav">
        <button className="btn ghost" onClick={() => setWeekOffset((w) => w - 1)}>
          ‹ Previous
        </button>
        <div className="weekLabel">
          <strong>
            {weekStartDate.toLocaleDateString(undefined, { month: "short", day: "numeric" })} –{" "}
            {weekEndDate.toLocaleDateString(undefined, { month: "short", day: "numeric" })}
          </strong>
          <span>{weekOffset === 0 ? "This week" : `${Math.abs(weekOffset)} week(s) back`}</span>
        </div>
        <button
          className="btn ghost"
          onClick={() => setWeekOffset((w) => Math.min(0, w + 1))}
          disabled={weekOffset >= 0}
        >
          Next ›
        </button>
        <button className="btn primary" onClick={buildCsv}>
          Export for payroll
        </button>
      </div>

      <div className="viewToggle">
        <button
          className={`mgrTab ${view === "hours" ? "on" : ""}`}
          onClick={() => setView("hours")}
        >
          Hours worked
        </button>
        <button
          className={`mgrTab ${view === "variance" ? "on" : ""}`}
          onClick={() => setView("variance")}
        >
          Against the schedule
        </button>
      </div>

      {employees.length === 0 ? (
        <p className="muted pad">Add people to the roster and their hours will show up here.</p>
      ) : view === "variance" ? (
        !sched || !sched.shifts || Object.keys(sched.shifts).length === 0 ? (
          <div className="schedEmpty">
            <p>No schedule built for this week.</p>
            <span>Build one in the Schedule tab and the comparison shows up here.</span>
          </div>
        ) : (
          <>
            <div className="tableWrap">
              <table className="tc">
                <thead>
                  <tr>
                    <th className="stick">Name</th>
                    {days.map((d) => (
                      <th key={d.toISOString()}>{fmtDateShort(d)}</th>
                    ))}
                    <th>Sched</th>
                    <th>Worked</th>
                    <th>Diff</th>
                    <th />
                  </tr>
                </thead>
                <tbody>
                  {rows.map((r) => (
                    <tr key={r.emp.id}>
                      <td className="stick nameCell">{r.emp.name}</td>
                      {r.variance.map((v) => (
                        <td key={v.day} className={`varCell ${v.kind || ""}`}>
                          {v.schedH === 0 && v.actualH === 0 ? (
                            <span className="zero">—</span>
                          ) : (
                            <>
                              <span className="varNum">
                                {v.diff > 0 ? "+" : ""}
                                {v.diff.toFixed(2)}
                              </span>
                              <em>
                                {v.schedH.toFixed(1)}→{v.actualH.toFixed(1)}
                              </em>
                            </>
                          )}
                        </td>
                      ))}
                      <td className="num">{r.schedTotal.toFixed(2)}</td>
                      <td className="num">{r.totals.total.toFixed(2)}</td>
                      <td className={`num tot ${r.varTotal > 0 ? "ot" : ""}`}>
                        {r.varTotal > 0 ? "+" : ""}
                        {r.varTotal.toFixed(2)}
                      </td>
                      <td>
                        <button className="btn tiny" onClick={() => setVarDetail(r)}>
                          Why
                        </button>
                      </td>
                    </tr>
                  ))}
                </tbody>
              </table>
            </div>

            {(() => {
              const s = rows.reduce((a, r) => a + r.schedTotal, 0);
              const w = rows.reduce((a, r) => a + r.totals.total, 0);
              const d = w - s;
              const cost = rows.reduce((a, r) => {
                const rate = parseFloat(r.emp.rate);
                return a + (isFinite(rate) ? r.varTotal * rate : 0);
              }, 0);
              return (
                <p className={`varSummary ${d > 0 ? "over" : d < 0 ? "under" : ""}`}>
                  Planned {s.toFixed(1)} hours, paid for {w.toFixed(1)}.{" "}
                  {Math.abs(d) < 0.05
                    ? "Right on plan."
                    : d > 0
                    ? `You're ${d.toFixed(1)} hours over${
                        cost > 0 ? `, roughly $${Math.abs(cost).toFixed(0)} at base rates` : ""
                      }.`
                    : `You're ${Math.abs(d).toFixed(1)} hours under plan.`}
                </p>
              );
            })()}
          </>
        )
      ) : (
        <div className="tableWrap">
          <table className="tc">
            <thead>
              <tr>
                <th className="stick">Name</th>
                {days.map((d) => (
                  <th key={d.toISOString()}>{fmtDateShort(d)}</th>
                ))}
                <th>Reg</th>
                <th>OT</th>
                <th>2x</th>
                <th>Total</th>
                <th>Premium</th>
                <th>Signed</th>
                <th />
              </tr>
            </thead>
            <tbody>
              {rows.map((r) => (
                <tr key={r.emp.id}>
                  <td className="stick nameCell">
                    {r.emp.name}
                    {r.anomalies > 0 && <span className="warnDot" title="Missing clock-out" />}
                  </td>
                  {r.dayHours.map((h, i) => (
                    <td key={i} className={h > 8 ? "hot" : h > 0 ? "" : "zero"}>
                      {h > 0 ? h.toFixed(2) : "—"}
                    </td>
                  ))}
                  <td className="num">{r.totals.reg.toFixed(2)}</td>
                  <td className="num ot">{r.totals.ot > 0 ? r.totals.ot.toFixed(2) : "—"}</td>
                  <td className="num ot">{r.totals.dt > 0 ? r.totals.dt.toFixed(2) : "—"}</td>
                  <td className="num tot">{r.totals.total.toFixed(2)}</td>
                  <td>
                    {r.mealPrem + r.restPrem > 0 ? (
                      <button className="sigTag bad" onClick={() => setBreakDetail(r)}>
                        {r.mealPrem + r.restPrem} hr
                      </button>
                    ) : r.flags.length > 0 ? (
                      <button className="sigTag warnEdit" onClick={() => setBreakDetail(r)}>
                        Waived
                      </button>
                    ) : (
                      <span className="sigTag none">—</span>
                    )}
                  </td>
                  <td>
                    {(() => {
                      const a = attest[r.emp.id];
                      if (!a) return <span className="sigTag none">Not yet</span>;
                      if (!a.agreed)
                        return (
                          <button className="sigTag bad" onClick={() => setViewSign(a)}>
                            Disputed
                          </button>
                        );
                      const drift =
                        Math.abs((a.totals?.total || 0) - r.totals.total) > 0.01;
                      return (
                        <button
                          className={`sigTag ${drift ? "warnEdit" : "ok"}`}
                          onClick={() => setViewSign(a)}
                        >
                          {drift ? "Signed, changed" : "Signed"}
                        </button>
                      );
                    })()}
                  </td>
                  <td>
                    <button
                      className="btn tiny"
                      onClick={() => setOpenEmp(openEmp === r.emp.id ? null : r.emp.id)}
                    >
                      {openEmp === r.emp.id ? "Hide" : "Punches"}
                    </button>
                  </td>
                </tr>
              ))}
            </tbody>
          </table>
        </div>
      )}

      {cfg.mealPay !== "unpaid" &&
        (() => {
          const count = rows.reduce((a, r) => a + r.paidMealCount, 0);
          if (!count) return null;
          const hrs = rows.reduce((a, r) => a + r.paidMealMs, 0) / 3600000;
          const cost = rows.reduce((a, r) => {
            const rate = parseFloat(r.emp.rate);
            return a + (isFinite(rate) ? (r.paidMealMs / 3600000) * rate : 0);
          }, 0);
          return (
            <p className="paidSummary">
              You covered {count} lunch{count === 1 ? "" : "es"} this week — {hrs.toFixed(1)} paid
              hours
              {cost > 0 ? `, about $${cost.toFixed(0)} at their base rates` : ""}.
            </p>
          );
        })()}

      {openEmp && (
        <PunchList
          emp={employees.find((e) => e.id === openEmp)}
          events={Object.values(months)
            .flat()
            .filter((e) => e.empId === openEmp && e.ts >= wStart && e.ts < wEnd)
            .sort((a, b) => a.ts - b.ts)}
          onEdit={(ev) => setEditing(ev)}
          onDelete={deleteEvent}
          onTogglePaid={togglePaidMeal}
          cfg={cfg}
          onAdd={() => setEditing({ empId: openEmp, type: "in", ts: Date.now(), isNew: true })}
        />
      )}

      <p className="legalNote">
        Overtime is figured on California rules: over 8 hours in a day at 1.5×, over 12 at 2×, and
        over 40 straight-time hours in a week at 1.5×. The seventh consecutive workday premium isn't
        calculated here — check those weeks by hand before you run payroll.
      </p>

      {editing && (
        <PunchEditor
          ev={editing}
          months={months}
          updateEvents={updateEvents}
          onClose={() => setEditing(null)}
          flash={flash}
        />
      )}

      {varDetail && (
        <VarianceModal row={varDetail} cfg={cfg} onClose={() => setVarDetail(null)} />
      )}

      {breakDetail && (
        <BreakDetailModal row={breakDetail} onClose={() => setBreakDetail(null)} />
      )}

      {viewSign && (
        <SignatureModal rec={viewSign} cfg={cfg} onClose={() => setViewSign(null)} />
      )}

      {csv != null && <CsvModal csv={csv} onClose={() => setCsv(null)} />}
    </div>
  );
}

    mealStart: "Lunch start",

            <li key={ev.id}>
              {photos[ev.id] ? (
                <button
                  className="thumbBtn"
                  onClick={() => setZoom({ src: photos[ev.id], ev })}
                  aria-label="Enlarge photo"

                  <img src={photos[ev.id]} alt="" className="thumb" />

              ) : (

              )}
              <span className={`punchType ${ev.type}`}>{label[ev.type]}</span>
              <span className="punchWhen">
                {fmtDateShort(new Date(ev.ts))} · {fmtTime(new Date(ev.ts))}

              {ev.edited && <span className="editedTag">edited</span>}

                <button
                  className={`payTag ${ev.paidMeal ? "on" : ""}`}

function PunchEditor({ ev, months, updateEvents, onClose, flash }) {
  const d = new Date(ev.ts);
  const [date, setDate] = useState(dayKey(d));
  const [time, setTime] = useState(fmtTimeInput(d));
  const [type, setType] = useState(ev.type);

  const save = async () => {
    const [y, mo, da] = date.split("-").map(Number);
    const [hh, mm] = time.split(":").map(Number);
    const ts = new Date(y, mo - 1, da, hh, mm, 0, 0).getTime();
    const newKey = ym(new Date(ts));
    const oldKey = ym(new Date(ev.ts));

    if (ev.isNew) {
      const list = [...(months[newKey] || []), { id: uid(), empId: ev.empId, type, ts, edited: true }];
      await updateEvents(newKey, list);
    } else if (newKey === oldKey) {
      const list = (months[oldKey] || []).map((x) =>
        x.id === ev.id ? { ...x, ts, type, edited: true } : x
      );
      await updateEvents(oldKey, list);
    } else {
      await updateEvents(oldKey, (months[oldKey] || []).filter((x) => x.id !== ev.id));
      await updateEvents(newKey, [...(months[newKey] || []), { ...ev, ts, type, edited: true }]);
    }
    flash("Punch saved");
    onClose();
  };

  return (
    <div className="overlay">
      <div className="editCard">
        <button className="closeX" onClick={onClose} aria-label="Close">
          ✕
        </button>
        <h2 className="editTitle">{ev.isNew ? "Add a punch" : "Fix a punch"}</h2>
        <label className="fld">
          <span>What kind</span>
          <select value={type} onChange={(e) => setType(e.target.value)}>
            <option value="in">Clock in</option>
            <option value="out">Clock out</option>
            <option value="mealStart">Lunch start</option>
            <option value="mealEnd">Lunch end</option>
            <option value="restStart">Rest break start</option>
            <option value="restEnd">Rest break end</option>
          </select>
        </label>
        <label className="fld">
          <span>Date</span>
          <input type="date" value={date} onChange={(e) => setDate(e.target.value)} />
        </label>
        <label className="fld">
          <span>Time</span>
          <input type="time" value={time} onChange={(e) => setTime(e.target.value)} />
        </label>
        <button className="btn primary lg full" onClick={save}>
          Save punch
        </button>
        <p className="setupNote">Edited punches are marked so you can spot them later.</p>
      </div>
    </div>
  );
}

function VarianceModal({ row, cfg, onClose }) {
  const days = row.variance.filter((v) => v.schedH > 0 || v.actualH > 0);
  return (
    <div className="overlay">
      <div className="reviewCard">
        <button className="closeX" onClick={onClose} aria-label="Close">
          ✕
        </button>
        <h2 className="editTitle">{row.emp.name} against the schedule</h2>
        <div className="sigSummary">
          <span>
            Scheduled <strong>{row.schedTotal.toFixed(2)}</strong>
          </span>
          <span>
            Worked <strong>{row.totals.total.toFixed(2)}</strong>
          </span>
          <span>
            Difference{" "}
            <strong>
              {row.varTotal > 0 ? "+" : ""}
              {row.varTotal.toFixed(2)}
            </strong>
          </span>
        </div>

        {days.length === 0 ? (
          <p className="muted pad">Nothing scheduled or worked this week.</p>
        ) : (
          <ul className="varList">
            {days.map((v) => {
              const info = row.byDay[v.day];
              const punches = info
                ? info.sessions
                    .map(
                      (s) =>
                        `${fmtTime(new Date(s.start))}–${
                          s.end ? fmtTime(new Date(s.end)) : "open"
                        }`
                    )
                    .join(", ")
                : "no punches";
              return (
                <li key={v.day} className={v.kind || ""}>
                  <div className="varHead">
                    <strong>{fmtDateShort(v.date)}</strong>
                    <span className={v.diff > 0 ? "ot" : ""}>
                      {v.diff > 0 ? "+" : ""}
                      {v.diff.toFixed(2)} hrs
                    </span>
                  </div>
                  <div className="varLines">
                    <p>
                      <em>Scheduled</em>{" "}
                      {v.shift
                        ? `${fmtHHMM(v.shift.start)} – ${fmtHHMM(v.shift.end)} (${v.schedH.toFixed(
                            1
                          )} hrs)`
                        : "not on the schedule"}
                    </p>
                    <p>
                      <em>Actual</em> {punches}
                      {v.actualH > 0 ? ` (${v.actualH.toFixed(1)} hrs)` : ""}
                    </p>
                  </div>
                  {v.notes.length > 0 && (
                    <ul className="varNotes">
                      {v.notes.map((n, i) => (
                        <li key={i}>{n}</li>
                      ))}
                    </ul>
                  )}
                </li>
              );
            })}
          </ul>
        )}

        <p className="legalNote">
          Anything inside {cfg.graceMin} minutes of the scheduled time isn't flagged. Change that
          slack in Settings. Worth remembering that time on the clock is time you owe regardless of
          what the schedule said — a tech who clocks in early is still working, so the fix is a
          conversation, not an edit to their punches.
        </p>
      </div>
    </div>
  );
}

function CsvModal({ csv, onClose }) {
  const taRef = useRef(null);
  const [copied, setCopied] = useState(false);
  const copy = async () => {
    try {
      await navigator.clipboard.writeText(csv);
      setCopied(true);
    } catch {
      if (taRef.current) {
        taRef.current.select();
        try {
          document.execCommand("copy");
          setCopied(true);
        } catch {
          setCopied(false);
        }
      }
    }
  };
  return (
    <div className="overlay">
      <div className="csvCard">
        <button className="closeX" onClick={onClose} aria-label="Close">
          ✕
        </button>
        <h2 className="editTitle">Payroll export</h2>
        <p className="muted">
          Copy this and paste it into a spreadsheet. Columns are ready for hours, OT, and double
          time.
        </p>
        <textarea ref={taRef} className="csvBox" readOnly value={csv} />
        <button className="btn primary lg full" onClick={copy}>
          {copied ? "Copied" : "Copy to clipboard"}
        </button>
      </div>
    </div>
  );
}

/* ---------- roster ---------- */
function Roster({ employees, saveEmployees, flash, cfg }) {
  const [draft, setDraft] = useState(null);
  const blank = { id: "", name: "", role: "", pin: "", rate: "", active: true };

  const save = async () => {
    if (!draft.name.trim()) return flash("Name can't be blank", "out");
    if (!/^\d{4}$/.test(draft.pin)) return flash("PIN must be 4 digits", "out");
    const clash = employees.find((e) => e.pin === draft.pin && e.id !== draft.id);
    if (clash) return flash(`${clash.name} already uses that PIN`, "out");
    let next;
    if (draft.id) next = employees.map((e) => (e.id === draft.id ? draft : e));
    else next = [...employees, { ...draft, id: uid() }];
    await saveEmployees(next);
    setDraft(null);
    flash("Roster saved");
  };

  const toggle = async (emp) => {
    await saveEmployees(
      employees.map((e) => (e.id === emp.id ? { ...e, active: e.active === false } : e))
    );
  };

  return (
    <div className="pane">
      <div className="rosterHead">
        <h2 className="paneTitle">Who works here</h2>
        <button className="btn primary" onClick={() => setDraft({ ...blank })}>
          Add someone
        </button>
      </div>

      {employees.length === 0 ? (
        <p className="muted pad">Nobody yet. Add your first technician.</p>
      ) : (
        <ul className="rosterList">
          {employees.map((e) => (
            <li key={e.id} className={e.active === false ? "off" : ""}>
              <div className="rosterMain">
                <strong>{e.name}</strong>
                <span>{e.role || "Technician"}</span>
              </div>
              <div className="rosterMeta">
                <span className="pinMask">PIN ••••</span>
                {e.rate ? <span>${e.rate}/hr</span> : null}
              </div>
              <div className="rosterActs">
                <button className="btn tiny" onClick={() => setDraft({ ...e })}>
                  Edit
                </button>
                <button className="btn tiny" onClick={() => toggle(e)}>
                  {e.active === false ? "Bring back" : "Set inactive"}
                </button>
              </div>
            </li>
          ))}
        </ul>
      )}

      {draft && (
        <div className="overlay">
          <div className="editCard">
            <button className="closeX" onClick={() => setDraft(null)} aria-label="Close">
              ✕
            </button>
            <h2 className="editTitle">{draft.id ? "Edit person" : "Add someone"}</h2>
            <label className="fld">
              <span>Name</span>
              <input
                value={draft.name}
                onChange={(e) => setDraft({ ...draft, name: e.target.value })}
                placeholder="First and last"
              />
            </label>
            <label className="fld">
              <span>Job</span>
              <input
                value={draft.role}
                onChange={(e) => setDraft({ ...draft, role: e.target.value })}
                placeholder="Lube tech, brake tech, service writer…"
              />
            </label>
            <div className="fldRow">
              <label className="fld">
                <span>PIN</span>
                <input
                  value={draft.pin}
                  inputMode="numeric"
                  onChange={(e) =>
                    setDraft({ ...draft, pin: e.target.value.replace(/\D/g, "").slice(0, 4) })
                  }
                  placeholder="4 digits"
                />
              </label>
              <label className="fld">
                <span>Hourly rate (optional)</span>
                <input
                  value={draft.rate}
                  inputMode="decimal"
                  onChange={(e) => setDraft({ ...draft, rate: e.target.value })}
                  placeholder="24.00"
                />
              </label>
            </div>
            <button className="btn primary lg full" onClick={save}>
              Save
            </button>
          </div>
        </div>
      )}
    </div>
  );
}

/* ---------- settings ---------- */
function Settings({ cfg, saveCfg, flash }) {
  const [d, setD] = useState(cfg);
  const [pin, setPin] = useState("");
  const set = (k, v) => setD({ ...d, [k]: v });
  const save = async () => {
    const next = { ...d };
    if (pin) {
      if (!/^\d{4}$/.test(pin)) return flash("Manager PIN must be 4 digits", "out");
      next.managerPin = pin;
    }
    await saveCfg(next);
    setPin("");
    flash("Settings saved");
  };
  const dayNames = ["Sunday", "Monday", "Tuesday", "Wednesday", "Thursday", "Friday", "Saturday"];
  return (
    <div className="pane">
      <h2 className="paneTitle">Settings</h2>
      <div className="settingsGrid">
        <label className="fld">
          <span>Shop name</span>
          <input value={d.shopName} onChange={(e) => set("shopName", e.target.value)} />
        </label>
        <label className="fld">
          <span>Pay week starts</span>
          <select value={d.weekStart} onChange={(e) => set("weekStart", Number(e.target.value))}>
            {dayNames.map((n, i) => (
              <option key={n} value={i}>
                {n}
              </option>
            ))}
          </select>
        </label>
        <label className="fld">
          <span>Round punches to</span>
          <select value={d.roundingMin} onChange={(e) => set("roundingMin", Number(e.target.value))}>
            <option value={0}>Exact minute</option>
            <option value={5}>Nearest 5 minutes</option>
            <option value={6}>Nearest 6 minutes (tenth of an hour)</option>
            <option value={15}>Nearest 15 minutes</option>
          </select>
        </label>
        <label className="fld">
          <span>Overtime rules</span>
          <select value={d.otRules} onChange={(e) => set("otRules", e.target.value)}>
            <option value="ca">California (daily and weekly)</option>
            <option value="flsa">Federal only (over 40 in a week)</option>
          </select>
        </label>
        <label className="fld">
          <span>California meal and rest tracking</span>
          <select
            value={d.breakRules ? "on" : "off"}
            onChange={(e) => set("breakRules", e.target.value === "on")}
          >
            <option value="on">On — track 30-min lunches and 10-min rest breaks</option>
            <option value="off">Off</option>
          </select>
        </label>
        {d.breakRules && (
          <label className="fld">
            <span>Warn the floor before a lunch deadline</span>
            <select
              value={d.breakReminderMin}
              onChange={(e) => set("breakReminderMin", Number(e.target.value))}
            >
              <option value={10}>10 minutes ahead</option>
              <option value={20}>20 minutes ahead</option>
              <option value={30}>30 minutes ahead</option>
              <option value={45}>45 minutes ahead</option>
            </select>
          </label>
        )}
        <div className="fldRow">
          <label className="fld">
            <span>Opens at</span>
            <select value={d.openHour} onChange={(e) => set("openHour", Number(e.target.value))}>
              {Array.from({ length: 13 }, (_, i) => i + 4).map((h) => (
                <option key={h} value={h}>
                  {h % 12 || 12}:00 {h >= 12 ? "PM" : "AM"}
                </option>
              ))}
            </select>
          </label>
          <label className="fld">
            <span>Closes at</span>
            <select value={d.closeHour} onChange={(e) => set("closeHour", Number(e.target.value))}>
              {Array.from({ length: 12 }, (_, i) => i + 12).map((h) => (
                <option key={h} value={h}>
                  {h % 12 || 12}:00 {h >= 12 ? "PM" : "AM"}
                </option>
              ))}
            </select>
          </label>
        </div>
        <label className="fld">
          <span>Photo at every punch</span>
          <select
            value={d.photos ? "on" : "off"}
            onChange={(e) => set("photos", e.target.value === "on")}
          >
            <option value="on">On — front camera snaps a photo</option>
            <option value="off">Off</option>
          </select>
        </label>
        {d.photos && (
          <div className="fldRow">
            <label className="fld">
              <span>If the camera fails</span>
              <select
                value={d.photoRequired ? "block" : "allow"}
                onChange={(e) => set("photoRequired", e.target.value === "block")}
              >
                <option value="allow">Let the punch through</option>
                <option value="block">Block the punch</option>
              </select>
            </label>
            <label className="fld">
              <span>Keep photos for</span>
              <select
                value={d.photoRetentionDays}
                onChange={(e) => set("photoRetentionDays", Number(e.target.value))}
              >
                <option value={14}>14 days</option>
                <option value={30}>30 days</option>
                <option value={45}>45 days</option>
                <option value={90}>90 days</option>
              </select>
            </label>
          </div>
        )}
        <label className="fld">
          <span>Sign off on hours at the end of the pay period</span>
          <select
            value={d.attestation ? "on" : "off"}
            onChange={(e) => set("attestation", e.target.value === "on")}
          >
            <option value="on">On — review and sign at the last clock-out</option>
            <option value="off">Off</option>
          </select>
        </label>
        {d.breakRules && (
          <>
            <label className="fld">
              <span>Paying for the 30-minute lunch</span>
              <select value={d.mealPay} onChange={(e) => set("mealPay", e.target.value)}>
                <option value="unpaid">Never — lunch is always unpaid</option>
                <option value="discretionary">When I say so — I mark individual lunches paid</option>
                <option value="always">Always — every lunch is paid</option>
              </select>
            </label>

            {d.mealPay === "discretionary" && (
              <div className="noteBox">
                Lunches start out unpaid. To gift one, open Timecards, hit Punches next to the tech,
                and tap Pay this lunch on that day. It adds the 30 minutes back to their hours right
                away. The break itself doesn't change — they're still off duty and free to leave, so
                nothing about compliance shifts.
              </div>
            )}
            {d.mealPay === "always" && (
              <div className="noteBox">
                Every lunch becomes hours worked. A tech clocked 8:00 to 5:00 lands at 9 hours
                instead of 8.5, so an hour of daily overtime shows up where a half hour did before.
                Figure about 2.5 paid hours a week per tech, some of it at time and a half.
              </div>
            )}
          </>
        )}

        <label className="fld">
          <span>Fewest people on the floor at once</span>
          <select value={d.minStaff} onChange={(e) => set("minStaff", Number(e.target.value))}>
            {[1, 2, 3, 4].map((n) => (
              <option key={n} value={n}>
                {n} {n === 1 ? "person" : "people"}
              </option>
            ))}
          </select>
        </label>
        <label className="fld">
          <span>Slack before a punch counts as late or early</span>
          <select value={d.graceMin} onChange={(e) => set("graceMin", Number(e.target.value))}>
            {[0, 3, 6, 10, 15].map((n) => (
              <option key={n} value={n}>
                {n === 0 ? "Exact — flag any difference" : `${n} minutes`}
              </option>
            ))}
          </select>
        </label>
        <label className="fld">
          <span>New manager PIN (leave blank to keep the current one)</span>
          <input
            value={pin}
            inputMode="numeric"
            onChange={(e) => setPin(e.target.value.replace(/\D/g, "").slice(0, 4))}
            placeholder="4 digits"
          />
        </label>
      </div>
      <button className="btn primary lg" onClick={save}>
        Save settings
      </button>
      <p className="legalNote">
        Rounding applies to how hours are totaled. The exact punch time is always kept underneath, so
        you can turn rounding off and the real numbers come back.
      </p>
      <p className="legalNote">
        Punch photos are small stills stored on this iPad only — nothing is uploaded anywhere. The
        camera preview stays visible while someone punches so nobody is recorded without seeing it.
        Photos delete themselves after the window you set above. California treats a face image as
        biometric-adjacent personal information, so tell your crew in writing that the clock takes a
        photo and why, and keep that notice with your handbook.
      </p>
    </div>
  );
}

.todayTag {
  grid-column:3; font-size:11px; color:var(--signal);
  border:1px solid rgba(242,163,16,.4); border-radius:999px; padding:3px 9px;
}

/* break tracking */
.floorAlert {
  display:flex; flex-wrap:wrap; gap:10px 24px;
  padding:14px 28px; background:rgba(242,163,16,.09);
  border-bottom:1px solid rgba(242,163,16,.3);
}
.floorItem { font-size:15px; color:var(--signal); }
.floorItem strong { color:var(--ink); font-weight:600; }
.floorItem.over { color:#f0a08d; }
.tileDue {
  font-size:12.5px; color:var(--muted); padding-top:2px;
  border-top:1px solid var(--line); margin-top:-2px;
}
.tileDue.soon { color:var(--signal); }
.tileDue.over { color:#f0a08d; }
.tileDue.timer { color:var(--brk); }
.tile.meal .tileRule { background:var(--signal); }
.tile.rest .tileRule { background:var(--brk); }
.pill.meal { color:var(--signal); border-color:rgba(242,163,16,.4); background:rgba(242,163,16,.08); }
.pill.rest { color:var(--brk); border-color:rgba(90,167,224,.4); background:rgba(90,167,224,.08); }

.breakTimer {
  display:flex; flex-direction:column; align-items:center; gap:4px;
  padding:16px; margin-bottom:18px; border-radius:12px;
  background:var(--asphalt); border:1px solid var(--line);
}
.breakTimer strong { font-size:38px; font-weight:300; letter-spacing:-0.03em; }
.breakTimer span { font-size:13px; color:var(--muted); text-align:center; }
.breakTimer.short strong { color:var(--signal); }
.breakTimer.done strong { color:var(--live); }

.dueBanner {
  padding:12px 14px; margin-bottom:16px; border-radius:10px; font-size:14px; line-height:1.45;
  background:rgba(242,163,16,.1); border:1px solid rgba(242,163,16,.35); color:var(--signal);
}
.dueBanner.over { background:rgba(226,89,63,.1); border-color:rgba(226,89,63,.4); color:#f0a08d; }

.bigAct em { display:block; font-style:normal; font-size:12.5px; font-weight:400; opacity:.72; margin-top:3px; }
.bigAct.meal { background:var(--signal); border-color:var(--signal); color:#1a1300; }
.bigAct { height:auto; min-height:76px; padding:14px 18px; }
.shortWarn { display:flex; flex-direction:column; gap:11px; }
.shortWarn p {
  margin:0; padding:14px; border-radius:10px; font-size:14px; line-height:1.5;
  background:rgba(226,89,63,.1); border:1px solid rgba(226,89,63,.35); color:#f0a08d;
}

.attestBlock { margin-bottom:22px; }
.attestQ { margin:0 0 12px; font-size:16px; font-weight:600; }
.attestOpts { display:flex; flex-direction:column; gap:10px; }
.attestOpt {
  text-align:left; padding:15px 17px; border-radius:12px;
  background:var(--asphalt); border:1px solid var(--line); color:var(--ink);
  display:flex; flex-direction:column; gap:4px;
}
.attestOpt strong { font-size:16px; font-weight:600; }
.attestOpt span { font-size:13.5px; color:var(--muted); line-height:1.45; }
.attestOpt.on { border-color:var(--signal); background:rgba(242,163,16,.09); }
.disputeBox.short { min-height:84px; }

.flagList { list-style:none; margin:18px 0 0; padding:0; display:flex; flex-direction:column; gap:12px; }
.flagList li { background:var(--asphalt); border:1px solid var(--line); border-radius:12px; padding:15px 17px; }
.flagHead { display:flex; justify-content:space-between; align-items:baseline; margin-bottom:8px; }
.flagHead span { font-size:13px; color:var(--muted); }
.flagIssues { margin:0 0 10px; padding-left:18px; font-size:14px; color:var(--signal); line-height:1.6; }
.flagAnswer { font-size:14px; color:var(--muted); line-height:1.55; }
.flagAnswer p { margin:0 0 4px; }
.flagAnswer.missing { color:#f0a08d; }
.flagNote { font-style:italic; color:var(--ink); margin-top:6px !important; }

/* end-of-period review */
.reviewCard {
  position:relative; background:var(--panel); border:1px solid var(--line);
  border-radius:18px; padding:28px; width:100%; max-width:620px;
  max-height:92vh; overflow-y:auto;
}
.reviewHead { display:flex; align-items:flex-start; justify-content:space-between; gap:18px; margin-bottom:20px; }
.reviewTitle { margin:0; font-size:25px; font-weight:600; letter-spacing:-0.02em; }
.reviewSub { margin:5px 0 0; color:var(--muted); font-size:15px; }
.reviewTotal { text-align:right; line-height:1.05; }
.reviewTotal strong { display:block; font-size:38px; font-weight:300; letter-spacing:-0.03em; }
.reviewTotal span { font-size:13px; color:var(--muted); }
.reviewDays { list-style:none; margin:0 0 16px; padding:0; border-top:1px solid var(--line); }
.reviewDays li {
  display:grid; grid-template-columns:88px 1fr auto 62px; gap:10px; align-items:center;
  padding:11px 2px; border-bottom:1px solid var(--line); font-size:15px;
}
.reviewDays li.off { color:#4c5663; }
.rdDay { color:var(--muted); font-size:14px; }
.rdPunch { font-size:14px; }
.rdBreak { font-size:12px; color:var(--brk); }
.rdHrs { text-align:right; font-weight:600; }
.reviewSplit { display:flex; gap:22px; flex-wrap:wrap; font-size:14px; color:var(--muted); margin-bottom:18px; }
.reviewSplit strong { color:var(--ink); font-size:16px; margin-left:4px; }
.reviewWarn {
  background:rgba(226,89,63,.1); border:1px solid rgba(226,89,63,.35);
  color:#f0a08d; padding:12px 14px; border-radius:10px; font-size:14px; margin:0 0 16px; line-height:1.5;
}
.reviewActs { display:flex; flex-direction:column; gap:11px; }
.linkBtn.wide { width:100%; margin-top:12px; }
.signLead { margin:0 0 18px; font-size:16px; line-height:1.55; }
.signFine { margin:14px 0 0; color:#5c6774; font-size:13px; line-height:1.5; }

/* signature pad */
.sigWrap { margin-bottom:18px; }
.sigPad {
  width:100%; height:170px; display:block; touch-action:none;
  background:#0d1116; border:1px solid var(--line); border-radius:12px;
  cursor:crosshair;
}
.sigBase { display:flex; align-items:center; justify-content:space-between; margin-top:8px; }
.sigX { color:#3d4854; font-size:13px; letter-spacing:-0.5px; overflow:hidden; white-space:nowrap; }
.sigImg { width:100%; border-radius:10px; border:1px solid var(--line); margin:16px 0 0; display:block; }
.sigSummary {
  display:flex; gap:18px; flex-wrap:wrap; margin:16px 0 0;
  padding:14px; background:var(--asphalt); border:1px solid var(--line);
  border-radius:10px; font-size:13px; color:var(--muted);
}
.sigSummary strong { color:var(--ink); font-size:15px; margin-left:5px; }
.disputeBox {
  background:var(--asphalt); border:1px solid var(--line); color:var(--ink);
  border-radius:10px; padding:14px; min-height:130px; width:100%; resize:vertical; line-height:1.5;
}
.disputeShow { margin-top:16px; }
.disputeLabel { margin:0 0 6px; font-size:13px; color:var(--muted); }
.disputeText {
  margin:0; padding:14px; background:var(--asphalt); border:1px solid rgba(226,89,63,.3);
  border-radius:10px; line-height:1.55; font-size:15px;
}
.sigTag {
  font-size:12px; padding:5px 10px; border-radius:999px;
  border:1px solid var(--line); background:transparent; color:var(--muted); white-space:nowrap;
}
.sigTag.ok { color:var(--live); border-color:rgba(63,181,106,.4); }
.sigTag.bad { color:var(--warn); border-color:rgba(226,89,63,.45); }
.sigTag.warnEdit { color:var(--signal); border-color:rgba(242,163,16,.45); }
.sigTag.none { color:#4c5663; }

/* punch photos */
.thumbBtn { padding:0; border:none; background:none; line-height:0; border-radius:8px; }
.thumb {
  width:56px; height:42px; object-fit:cover; border-radius:8px;
  border:1px solid var(--line); display:block;
}
.thumb.empty {
  display:flex; align-items:center; justify-content:center;
  color:#4c5663; font-size:11px; background:#0d1116;
}
.zoomCard {
  position:relative; background:var(--panel); border:1px solid var(--line);
  border-radius:16px; padding:26px; max-width:440px; width:100%;
}
.zoomImg { width:100%; border-radius:12px; display:block; }
.zoomMeta { margin:14px 0 0; text-align:center; color:var(--muted); font-size:14px; }

/* toast */
.toast {
  position:fixed; left:50%; bottom:36px; transform:translateX(-50%);
  background:var(--live); color:#04180c; padding:16px 28px; border-radius:12px;
  font-size:18px; font-weight:600; z-index:80; box-shadow:0 10px 40px rgba(0,0,0,.5);
}
.toast.out { background:var(--signal); color:#1a1300; }

/* setup */
.setupWrap { flex:1; display:flex; align-items:center; justify-content:center; padding:24px; }
.setupCard { width:100%; max-width:460px; background:var(--panel); border:1px solid var(--line); border-radius:18px; padding:32px; }
.setupTitle { margin:0 0 8px; font-size:27px; font-weight:600; letter-spacing:-0.02em; }
.setupLead { margin:0 0 22px; color:var(--muted); line-height:1.5; font-size:15px; }
.setupNote { margin:14px 0 0; color:#5c6774; font-size:13px; line-height:1.5; }
.fld { display:flex; flex-direction:column; gap:7px; margin-bottom:16px; }
.fld > span { font-size:14px; color:var(--muted); }
.fld input, .fld select, .fld textarea {
  background:var(--asphalt); border:1px solid var(--line); color:var(--ink);
  border-radius:10px; padding:14px 14px; min-height:52px;
}
.fld input:focus, .fld select:focus { outline:2px solid var(--signal); outline-offset:1px; }
.fldRow { display:flex; gap:14px; }
.fldRow .fld { flex:1; }
.fldErr { color:var(--warn); font-size:14px; margin:0 0 10px; }

/* manager */
.mgr { flex:1; display:flex; flex-direction:column; }
.mgrBar {
  display:flex; align-items:center; justify-content:space-between;
  padding:16px 24px; border-bottom:1px solid var(--line); gap:12px;
}
.mgrTabs { display:flex; gap:6px; }
.mgrTab {
  background:transparent; border:1px solid transparent; color:var(--muted);
  padding:10px 18px; border-radius:9px; font-size:16px;
}
.mgrTab.on { color:var(--ink); border-color:var(--line); background:var(--panel); }
.pane { padding:22px 24px 40px; }
.paneTitle { margin:0 0 16px; font-size:21px; font-weight:600; }
.muted { color:var(--muted); }
.pad { padding:20px 0; }

/* timecards */
.weekNav { display:flex; align-items:center; gap:12px; margin-bottom:18px; flex-wrap:wrap; }
.weekLabel { display:flex; flex-direction:column; gap:2px; min-width:180px; }
.weekLabel strong { font-size:17px; }
.weekLabel span { font-size:13px; color:var(--muted); }
.tableWrap { overflow-x:auto; border:1px solid var(--line); border-radius:12px; }
table.tc { width:100%; border-collapse:collapse; font-size:15px; }
table.tc th, table.tc td { padding:13px 12px; text-align:center; border-bottom:1px solid var(--line); white-space:nowrap; }
table.tc th { color:var(--muted); font-weight:500; font-size:13px; background:var(--panel); }
table.tc td.zero { color:#4c5663; }
table.tc td.hot { color:var(--signal); }
table.tc td.num { color:var(--ink); }
table.tc td.ot { color:var(--signal); }
table.tc td.tot { font-weight:700; }
.stick { text-align:left !important; position:sticky; left:0; background:var(--panel); z-index:2; }
.nameCell { font-weight:600; }
.warnDot { display:inline-block; width:8px; height:8px; border-radius:50%; background:var(--warn); margin-left:8px; vertical-align:middle; }

.punches { margin-top:22px; background:var(--panel); border:1px solid var(--line); border-radius:12px; padding:18px; }
.punchesHead { display:flex; align-items:center; justify-content:space-between; margin-bottom:12px; gap:12px; }
.punchesHead h3 { margin:0; font-size:16px; font-weight:600; }
.punchList { list-style:none; margin:0; padding:0; display:flex; flex-direction:column; }
.punchList li { display:flex; align-items:center; gap:14px; padding:11px 0; border-bottom:1px solid var(--line); flex-wrap:wrap; }
.punchList li:last-child { border-bottom:none; }
.punchType { font-size:14px; min-width:110px; }
.punchType.in, .punchType.mealEnd, .punchType.restEnd, .punchType.breakEnd { color:var(--live); }
.punchType.out { color:var(--signal); }
.punchType.breakStart, .punchType.mealStart { color:var(--signal); }
.punchType.restStart { color:var(--brk); }
.punchType.breakAttest { color:var(--muted); }
.punchWhen { font-size:15px; }
.editedTag { font-size:12px; color:var(--muted); border:1px solid var(--line); padding:2px 8px; border-radius:999px; }
.punchActs { margin-left:auto; display:flex; gap:8px; }
.legalNote { margin-top:22px; color:#5c6774; font-size:13px; line-height:1.6; max-width:78ch; }

.csvBox {
  width:100%; height:260px; margin:12px 0 4px;
  background:var(--asphalt); border:1px solid var(--line); color:var(--ink);
  border-radius:10px; padding:12px; font-size:13px; white-space:pre;
}
.editTitle { margin:0 0 16px; font-size:22px; font-weight:600; }

/* roster */
.rosterHead { display:flex; align-items:center; justify-content:space-between; margin-bottom:16px; }
.rosterList { list-style:none; margin:0; padding:0; display:flex; flex-direction:column; gap:10px; }
.rosterList li {
  display:flex; align-items:center; gap:16px; flex-wrap:wrap;
  background:var(--panel); border:1px solid var(--line); border-radius:12px; padding:16px 18px;
}
.rosterList li.off { opacity:.45; }
.rosterMain { display:flex; flex-direction:column; gap:2px; min-width:180px; }
.rosterMain strong { font-size:17px; }
.rosterMain span { font-size:14px; color:var(--muted); }
.rosterMeta { display:flex; gap:16px; color:var(--muted); font-size:14px; }
.rosterActs { margin-left:auto; display:flex; gap:8px; }
.pinMask { letter-spacing:.1em; }

.settingsGrid { max-width:520px; }

/* boot */
.bootWrap { flex:1; display:flex; flex-direction:column; align-items:center; justify-content:center; gap:16px; }
.bootPulse { width:36px; height:36px; border-radius:50%; border:2px solid var(--line); border-top-color:var(--signal); animation:spin 1s linear infinite; }
@keyframes spin { to { transform:rotate(360deg); } }
.bootTxt { color:var(--muted); }

@media (prefers-reduced-motion: reduce) {
  * { animation:none !important; transition:none !important; }
}
@media (max-width:700px) {
  .bar { flex-direction:column; align-items:flex-start; gap:10px; }
  .barRight { text-align:left; }
  .grid { padding:16px; }
}
`}</style>
  );
}


const boot = document.getElementById("boot");
if (boot) boot.remove();
ReactDOM.createRoot(document.getElementById("root")).render(<TimeClock />);
